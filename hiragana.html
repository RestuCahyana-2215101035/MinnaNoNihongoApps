<!DOCTYPE html>
<html lang="id">

  <script>
    tailwind.config = { darkMode: 'class', }

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

</head>
<body class="antialiased bg-[#F4F7FE] dark:bg-slate-950 text-slate-700 dark:text-slate-100 transition-colors duration-300" x-data="hiraganaApp()" x-init="initApp()">

  <div class="flex h-screen overflow-hidden">
    
    <!-- Mobile Sidebar Overlay -->
    <div x-show="sidebarOpen" @click="sidebarOpen = false" class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs z-40 md:hidden" x-transition.opacity></div>

    <!-- SIDEBAR CONTAINER -->
    <div id="sidebar-container" class="contents"></div>

    <!-- MAIN CONTENT AREA -->
    <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
      
      <!-- HEADER CONTAINER -->
      <div id="header-container" class="contents"></div>

      <!-- MAIN BODY CONTENT (Isi Halaman Hiragana) -->
      <main class="flex-1 overflow-y-auto p-8 space-y-6">
        
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-white dark:bg-slate-900 p-6 rounded-3xl border border-slate-100 dark:border-slate-800 shadow-2xs">
          <div>
            <h3 class="text-base font-bold text-slate-900 dark:text-white mb-1">Tabel Lengkap Hiragana</h3>
            <p class="text-xs text-slate-500 dark:text-slate-400">Mencakup vokal dasar, konsonan baris, dakuon, handakuon, hingga gabungan bunyi (yoon).</p>
          </div>
          <span class="text-xs bg-blue-50 dark:bg-blue-950/50 text-blue-600 dark:text-blue-400 font-bold px-4 py-2 rounded-xl border border-blue-100 dark:border-blue-900/50" x-text="hiraganaList.length + ' Karakter'"></span>
        </div>

        <!-- TABEL HIRAGANA -->
        <div class="bg-white dark:bg-slate-900 rounded-3xl border border-slate-100 dark:border-slate-800 shadow-sm overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse min-w-[400px]">
              <thead>
                <tr class="bg-slate-50 dark:bg-slate-800/60 border-b border-slate-100 dark:border-slate-800 text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">
                  <th class="py-4 px-6">Kategori Bunyi</th>
                  <th class="py-4 px-6">Romaji</th>
                  <th class="py-4 px-6 text-center">Huruf Hiragana</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-100 dark:divide-slate-800/60 text-sm">
                <template x-for="(item, index) in hiraganaList" :key="index">
                  <tr class="hover:bg-slate-50/80 dark:hover:bg-slate-800/40 transition">
                    <td class="py-4 px-6 font-medium text-slate-800 dark:text-slate-200" x-text="item.kategori"></td>
                    <td class="py-4 px-6 italic font-mono text-slate-500 dark:text-slate-400" x-text="item.romaji"></td>
                    <td class="py-4 px-6 font-bold text-slate-900 dark:text-white text-3xl text-center font-serif" x-text="item.hiragana"></td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </div>

      </main>
    </div>
  </div>

  <script>
    function hiraganaApp() {
      return {
        sidebarOpen: false,
        materiAwalDropdown: true,
        kotobaDropdown: false,
        darkMode: false,

        async initApp() {
          this.initTheme();
          try {
            const sidebarRes = await fetch('./sidebar.html');
            if (sidebarRes.ok) {
              document.getElementById('sidebar-container').innerHTML = await sidebarRes.text();
            }
            const headerRes = await fetch('./header.html');
            if (headerRes.ok) {
              document.getElementById('header-container').innerHTML = await headerRes.text();
              // Inisialisasi ulang event listener untuk tombol dark mode di header eksternal jika ada
              this.bindHeaderThemeToggle();
            }
          } catch (e) {
            console.error('Gagal memuat template modular:', e);
          }
        },

        initTheme() {
          const savedTheme = localStorage.getItem('theme');
          // Jika belum ada settingan sama sekali, default ke 'light'
          if (savedTheme === 'dark') {
            this.darkMode = true;
            document.documentElement.classList.add('dark');
          } else {
            this.darkMode = false;
            document.documentElement.classList.remove('dark');
            localStorage.setItem('theme', 'light');
          }
        },
        
        toggleDarkMode() {
          this.darkMode = !this.darkMode;
          if (this.darkMode) {
            document.documentElement.classList.add('dark');
            localStorage.setItem('theme', 'dark');
          } else {
            document.documentElement.classList.remove('dark');
            localStorage.setItem('theme', 'light');
          }
        },

        bindHeaderThemeToggle() {
          // Menangkap tombol pemicu dark mode dari header.html yang dimuat secara dinamis
          setTimeout(() => {
            const themeBtn = document.querySelector('#header-container [data-theme-toggle], header button');
            if (themeBtn) {
              themeBtn.addEventListener('click', () => {
                this.toggleDarkMode();
              });
            }
          }, 100);
        },

        // Data Hiragana Lengkap
        hiraganaList: [
