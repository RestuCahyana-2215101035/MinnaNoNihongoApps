<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Minna no Nihongo - Penanda Waktu</title>
  
  <!-- Style Anti-Flicker Alpine & Fix Scrolling iOS -->
  <style>
    [x-cloak] { display: none !important; }
    body { font-family: 'DM Sans', sans-serif; }
    .-webkit-overflow-scrolling-touch {
      -webkit-overflow-scrolling: touch;
    }
  </style>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>

  <!-- Google Fonts: DM Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
  
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Alpine.js (Loaded Deferred) -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="antialiased bg-[#F4F7FE] dark:bg-slate-950 text-slate-700 dark:text-slate-100 transition-colors duration-300" x-data="penandaWaktuApp()" x-init="initApp()">

  <!-- Layout Wrapper menggunakan 100dvh untuk kalkulasi tepat di Dynamic Toolbar iOS Safari -->
  <div class="flex h-screen h-[100dvh] overflow-hidden relative">
    
    <!-- Mobile Sidebar Overlay -->
    <div x-show="sidebarOpen" 
         @click="sidebarOpen = false" 
         x-cloak
         class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs z-40 md:hidden transition-opacity" 
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         x-transition:leave="transition ease-in duration-200"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0"></div>

    <!-- SIDEBAR CONTAINER (Optimasi Flexbox & Z-Index Khusus Safari WebKit) -->
    <div id="sidebar-container" class="relative z-50 h-full flex shrink-0"></div>

    <!-- MAIN CONTENT AREA -->
    <div class="flex-1 flex flex-col min-w-0 overflow-hidden w-full">
      
      <!-- HEADER CONTAINER -->
      <div id="header-container" class="shrink-0 w-full z-30"></div>

      <!-- MAIN BODY CONTENT -->
      <main class="flex-1 overflow-y-auto p-4 md:p-8 space-y-8 -webkit-overflow-scrolling-touch">
        
        <!-- Header Halaman -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-white dark:bg-slate-900 p-6 rounded-3xl border border-slate-100 dark:border-slate-800 shadow-2xs">
          <div>
            <h3 class="text-base font-bold text-slate-900 dark:text-white mb-1">Penanda Waktu (Jam, Hari, Tanggal & Bulan)</h3>
            <p class="text-xs text-slate-500 dark:text-slate-400">Daftar lengkap kosakata penunjuk waktu spesifik dalam bahasa Jepang untuk tingkat dasar (N5).</p>
          </div>
          <span class="text-xs bg-blue-50 dark:bg-blue-950/50 text-blue-600 dark:text-blue-400 font-bold px-4 py-2 rounded-xl border border-blue-100 dark:border-blue-900/50">Materi Lengkap N5</span>
        </div>

        <!-- DAFTAR KELOMPOK PENANDA WAKTU -->
        <div class="space-y-8">
          <template x-for="sub in penandaWaktuList" :key="sub.subJudul">
            <div class="space-y-3">
              <div class="flex items-center gap-2 border-b-2 border-blue-600 dark:border-blue-500 pb-1.5">
                <i class="fa-regular fa-calendar-days text-blue-600 dark:text-blue-400"></i>
                <h3 class="text-base font-bold text-slate-900 dark:text-white" x-text="sub.subJudul"></h3>
              </div>
              <div class="bg-white dark:bg-slate-900 rounded-3xl border border-slate-100 dark:border-slate-800 shadow-sm overflow-hidden">
                <div class="overflow-x-auto">
                  <table class="w-full text-left border-collapse min-w-[500px]">
                    <thead>
                      <tr class="bg-slate-50 dark:bg-slate-800/60 border-b border-slate-100 dark:border-slate-800 text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">
                        <th class="py-3.5 px-6">Bahasa Indonesia</th>
                        <th class="py-3.5 px-6">Romaji</th>
                        <th class="py-3.5 px-6">Hiragana</th>
                        <th class="py-3.5 px-6">Katakana</th>
                      </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100 dark:divide-slate-800/60 text-sm">
                      <template x-for="(item, index) in sub.items" :key="index">
                        <tr class="hover:bg-slate-50/80 dark:hover:bg-slate-800/40 transition">
                          <td class="py-3.5 px-6 font-medium text-slate-800 dark:text-slate-200" x-text="item.indonesia"></td>
                          <td class="py-3.5 px-6 italic font-mono text-slate-500 dark:text-slate-400" x-text="item.romaji"></td>
                          <td class="py-3.5 px-6 font-bold text-slate-900 dark:text-white" x-text="item.hiragana"></td>
                          <td class="py-3.5 px-6 text-blue-600 dark:text-blue-400 font-medium" x-text="item.katakana"></td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </template>
        </div>

      </main>
    </div>
  </div>

  <script>
    function penandaWaktuApp() {
      return {
        sidebarOpen: false,
        materiAwalDropdown: true,
        kotobaDropdown: false,
        darkMode: false,

        async initApp() {
          this.initTheme();
          
          try {
            // Menggunakan Promise.allSettled agar pemuatan aman di iOS Safari
            const [sidebarRes, headerRes] = await Promise.allSettled([
              fetch('sidebar.html'),
              fetch('header.html')
            ]);

            // Inisialisasi Sidebar
            if (sidebarRes.status === 'fulfilled' && sidebarRes.value.ok) {
              const sidebarContainer = document.getElementById('sidebar-container');
              if (sidebarContainer) {
                sidebarContainer.innerHTML = await sidebarRes.value.text();
                this.renderDynamicKotobaSubmenus();
                
                // Re-initialize DOM Tree untuk Alpine di iOS WebKit
                if (window.Alpine) {
                  Alpine.initTree(sidebarContainer);
                }
              }
            }
            
            // Inisialisasi Header
            if (headerRes.status === 'fulfilled' && headerRes.value.ok) {
              const headerContainer = document.getElementById('header-container');
              if (headerContainer) {
                headerContainer.innerHTML = await headerRes.value.text();
                
                // Re-initialize DOM Tree untuk Alpine di iOS WebKit
                if (window.Alpine) {
                  Alpine.initTree(headerContainer);
                }
                this.bindHeaderThemeToggle();
              }
            }
          } catch (e) {
            console.error('Gagal memuat template modular:', e);
          }
        },

        renderDynamicKotobaSubmenus() {
          const container = document.getElementById('dynamic-kotoba-links');
          if (!container) return;

          let submenus = [];
          try {
            submenus = JSON.parse(localStorage.getItem('minna_submenus'));
          } catch(e) {
            submenus = null;
          }

          if (!submenus || !Array.isArray(submenus)) {
            submenus = [
              { id: 'ungkapan_waktu', title: 'Ungkapan Waktu' },
              { id: 'penanda_waktu', title: 'Penanda Waktu' },
              { id: 'kata_keterangan', title: 'Kata Keterangan' },
              { id: 'kata_benda', title: 'Kata Benda' },
              { id: 'kk_gol1', title: 'Kata Kerja Golongan I' },
              { id: 'kk_gol2', title: 'Kata Kerja Golongan II' },
              { id: 'kk_gol3', title: 'Kata Kerja Golongan III' },
              { id: 'salam', title: 'Salam (Aisatsu)' },
              { id: 'kazoku', title: 'Kazoku (Keluarga)' }
            ];
            localStorage.setItem('minna_submenus', JSON.stringify(submenus));
          }

          container.innerHTML = '';
          submenus.forEach(sub => {
            const link = document.createElement('a');
            link.href = `kotoba.html?cat=${sub.id}`;
            link.className = 'flex items-center gap-3 py-2.5 px-4 rounded-xl text-xs font-semibold text-slate-500 dark:text-slate-400 hover:text-blue-600 dark:hover:text-white hover:bg-slate-50 dark:hover:bg-slate-800/50 transition';
            link.innerHTML = `<i class="fa-solid fa-angle-right text-[10px]"></i> ${sub.title}`;
            container.appendChild(link);
          });
        },

        initTheme() {
          const savedTheme = localStorage.getItem('theme');
          if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            this.darkMode = true;
            document.documentElement.classList.add('dark');
          } else {
            this.darkMode = false;
            document.documentElement.classList.remove('dark');
            localStorage.setItem('theme', 'light');
          }
        },
        
        toggleDarkMode() {
          this.darkMode = !this.darkMode;
          if (this.darkMode) {
            document.documentElement.classList.add('dark');
            localStorage.setItem('theme', 'dark');
          } else {
            document.documentElement.classList.remove('dark');
            localStorage.setItem('theme', 'light');
          }
        },

        bindHeaderThemeToggle() {
          this.$nextTick(() => {
            const themeBtn = document.querySelector('#header-container [data-theme-toggle], #header-container button');
            if (themeBtn) {
              themeBtn.addEventListener('click', () => {
                this.toggleDarkMode();
              });
            }
          });
        },

        // Data Penanda Waktu Lengkap
        penandaWaktuList: [
          {
            subJudul: "Jam (時 - Ji)",
            items: [
              { indonesia: "Jam 1", romaji: "ichiji", hiragana: "いちじ", katakana: "イチジ" },
              { indonesia: "Jam 2", romaji: "niji", hiragana: "にじ", katakana: "ニジ" },
              { indonesia: "Jam 3", romaji: "sanji", hiragana: "さんじ", katakana: "サンジ" },
              { indonesia: "Jam 4", romaji: "yoji", hiragana: "よじ", katakana: "ヨジ" },
              { indonesia: "Jam 5", romaji: "goji", hiragana: "ごじ", katakana: "ゴジ" },
              { indonesia: "Jam 6", romaji: "rokuji", hiragana: "ろくじ", katakana: "ロクジ" },
              { indonesia: "Jam 7", romaji: "shichiji", hiragana: "しちじ", katakana: "シチジ" },
              { indonesia: "Jam 8", romaji: "hachiji", hiragana: "はちじ", katakana: "ハチジ" },
              { indonesia: "Jam 9", romaji: "kuji", hiragana: "くじ", katakana: "クジ" },
              { indonesia: "Jam 10", romaji: "juuji", hiragana: "じゅうじ", katakana: "ジュウジ" },
              { indonesia: "Jam 11", romaji: "juuichiji", hiragana: "じゅういちじ", katakana: "ジュウイチジ" },
              { indonesia: "Jam 12", romaji: "juuniji", hiragana: "じゅうにじ", katakana: "ジュウニジ" },
              { indonesia: "Jam berapa?", romaji: "nanji", hiragana: "なんじ", katakana: "ナンジ" }
            ]
          },
          {
            subJudul: "Menit (分 - Fun/Pun)",
            items: [
              { indonesia: "Menit 1", romaji: "ippun", hiragana: "いっぷん", katakana: "イップン" },
              { indonesia: "Menit 2", romaji: "nifun", hiragana: "にふん", katakana: "ニフン" }
            ]
          }
        ]
      }
    }
  </script>
</body>
</html>
