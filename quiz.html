<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minna no Nihongo - Uji Pemahaman Modern</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class', }
  </script>
  <!-- Google Fonts: DM Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
  
  <!-- Alpine.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    body { font-family: 'DM Sans', sans-serif; }
  </style>
</head>
<body class="antialiased bg-[#F4F7FE] dark:bg-slate-950 text-slate-700 dark:text-slate-100 transition-colors duration-300" x-data="quizApp()" x-init="initApp()">

  <div class="flex h-screen overflow-hidden">
    
    <!-- Mobile Sidebar Overlay -->
    <div x-show="sidebarOpen" @click="sidebarOpen = false" class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs z-40 md:hidden" x-transition.opacity></div>

    <!-- SIDEBAR CONTAINER -->
    <div id="sidebar-container" class="contents"></div>

    <!-- MAIN CONTENT AREA -->
    <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
      
      <!-- HEADER CONTAINER -->
      <div id="header-container" class="contents"></div>

      <!-- MAIN BODY CONTENT -->
      <main class="flex-1 overflow-y-auto p-6 md:p-10 space-y-6">
        
        <!-- Header Halaman Modern (Desain Proporsional & Warna Biru Elegan) -->
        <div class="bg-gradient-to-r from-blue-600 via-indigo-600 to-blue-700 p-6 md:p-7 rounded-3xl text-white shadow-xl flex flex-col md:flex-row justify-between items-center gap-6">
          <div class="space-y-1.5 flex-1">
            <span class="bg-white/20 backdrop-blur-md px-3.5 py-0.5 rounded-full text-[10px] font-extrabold uppercase tracking-widest border border-white/20 inline-block shadow-xs">
              <i class="fa-solid fa-graduation-cap mr-1"></i> Ujian Interaktif Premium
            </span>
            <h2 class="text-xl md:text-2xl font-black tracking-tight">Uji Pemahaman Bahasa Jepang</h2>
            <p class="text-xs text-blue-100 max-w-xl">Uji kemampuan dari materi Kanji, Hiragana, Katakana, Penanda Waktu, Ungkapan Waktu, Kata Bilangan (Suuji), hingga kategori Kotoba dengan sistem cerdas.</p>
          </div>
          
          <div class="bg-white/10 backdrop-blur-md border border-white/20 px-5 py-3 rounded-2xl flex items-center gap-3 shrink-0 shadow-inner">
            <div class="w-10 h-10 rounded-xl bg-white/20 flex items-center justify-center text-base font-bold">
              <i class="fa-solid fa-brain"></i>
            </div>
            <div>
              <div class="text-[9px] text-blue-200 font-bold uppercase tracking-wider">Total Bank Soal</div>
              <div class="text-base font-black" x-text="maxAvailableQuestions + ' Soal'"></div>
            </div>
          </div>
        </div>

        <!-- ============================================== -->
        <!-- TAHAP 1: SETUP PENGATURAN KUIS -->
        <!-- ============================================== -->
        <template x-if="quizStage === 'setup'">
          <div class="bg-white dark:bg-slate-900 p-8 rounded-3xl border border-slate-100 dark:border-slate-800 shadow-xl space-y-8 max-w-3xl mx-auto w-full transition-all duration-300">
            <div class="flex items-center justify-between border-b border-slate-100 dark:border-slate-800 pb-4">
              <h4 class="text-sm font-black text-slate-900 dark:text-white flex items-center gap-2.5 uppercase tracking-wider">
                <div class="w-8 h-8 rounded-xl bg-blue-50 dark:bg-blue-950/50 text-blue-600 flex items-center justify-center text-xs shadow-xs">
                  <i class="fa-solid fa-sliders"></i>
                </div> 
                Konfigurasi Soal Ujian
              </h4>
              <div class="flex items-center gap-2">
                <button @click="selectAllCategories()" class="text-[11px] font-bold text-blue-600 dark:text-blue-400 hover:underline cursor-pointer">Pilih Semua</button>
                <span class="text-slate-300 dark:text-slate-700">|</span>
                <button @click="deselectAllCategories()" class="text-[11px] font-bold text-slate-400 hover:underline cursor-pointer">Batal Semua</button>
              </div>
            </div>

            <!-- Pilih Kategori -->
            <div class="space-y-3">
              <label class="block text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider">Pilih Kategori Materi (Centang Minimal 1):</label>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 max-h-64 overflow-y-auto pr-2">
                <template x-for="cat in availableCategories" :key="cat.key">
                  <label :class="selectedCategories.includes(cat.key) ? 'border-blue-500 bg-blue-50/50 dark:bg-blue-950/20 shadow-xs' : 'border-slate-100 dark:border-slate-800 hover:bg-slate-50 dark:hover:bg-slate-800/40'" class="flex items-center p-3.5 rounded-2xl border-2 cursor-pointer transition text-xs font-semibold">
                    <input type="checkbox" :value="cat.key" x-model="selectedCategories" @change="updateMaxQuestions()" class="w-4 h-4 text-blue-600 rounded border-slate-300 focus:ring-blue-500 cursor-pointer">
                    <span class="ml-3 text-slate-700 dark:text-slate-300 font-bold" x-text="cat.title"></span>
                  </label>
                </template>
              </div>
            </div>

            <!-- Mode Soal -->
            <div class="space-y-3">
              <label class="block text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider">Format Pertanyaan:</label>
              <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 text-xs font-semibold">
                <label :class="quizQuestionMode === 'indonesia' ? 'border-blue-500 bg-blue-50/50 dark:bg-blue-950/25' : 'border-slate-200 dark:border-slate-800'" class="flex items-center p-4 rounded-2xl border-2 cursor-pointer transition">
                  <input type="radio" value="indonesia" x-model="quizQuestionMode" class="w-4 h-4 text-blue-600 focus:ring-blue-500 cursor-pointer">
                  <span class="ml-2.5 text-slate-700 dark:text-slate-300 font-bold">Bahasa Indonesia</span>
                </label>
                <label :class="quizQuestionMode === 'romaji' ? 'border-blue-500 bg-blue-50/50 dark:bg-blue-950/25' : 'border-slate-200 dark:border-slate-800'" class="flex items-center p-4 rounded-2xl border-2 cursor-pointer transition">
                  <input type="radio" value="romaji" x-model="quizQuestionMode" class="w-4 h-4 text-blue-600 focus:ring-blue-500 cursor-pointer">
                  <span class="ml-2.5 text-slate-700 dark:text-slate-300 font-bold">Romaji</span>
                </label>
                <label :class="quizQuestionMode === 'both' ? 'border-blue-500 bg-blue-50/50 dark:bg-blue-950/25' : 'border-slate-200 dark:border-slate-800'" class="flex items-center p-4 rounded-2xl border-2 cursor-pointer transition">
                  <input type="radio" value="both" x-model="quizQuestionMode" class="w-4 h-4 text-blue-600 focus:ring-blue-500 cursor-pointer">
                  <span class="ml-2.5 text-slate-700 dark:text-slate-300 font-bold">Acak Keduanya</span>
                </label>
              </div>
            </div>

            <!-- Waktu & Input Jumlah Soal Bebas -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs">
              <div class="space-y-2">
                <label class="block font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider">Batas Waktu:</label>
                <select x-model="quizTimeOption" class="w-full p-4 rounded-2xl border-2 border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950 font-bold focus:outline-none focus:border-blue-500 transition">
                  <option value="0">Tanpa Batas Waktu</option>
                  <option value="1">1 Menit</option>
                  <option value="3">3 Menit</option>
                  <option value="5">5 Menit</option>
                </select>
              </div>
              <div class="space-y-2">
                <div class="flex justify-between items-center">
                  <label class="block font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider">Jumlah Soal:</label>
                  <span class="text-[11px] text-blue-600 dark:text-blue-400 font-black" x-text="'Maks: ' + maxAvailableQuestions + ' soal'"></span>
                </div>
                <input type="number" min="1" :max="maxAvailableQuestions" x-model.number="quizLength" class="w-full p-4 rounded-2xl border-2 border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950 font-bold focus:outline-none focus:border-blue-500 transition">
              </div>
            </div>

            <button @click="startQuiz()" :disabled="selectedCategories.length === 0" :class="selectedCategories.length === 0 ? 'bg-slate-300 dark:bg-slate-800 text-slate-400 cursor-not-allowed shadow-none' : 'bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white shadow-xl shadow-blue-500/25 cursor-pointer hover:scale-[1.01]'" class="w-full py-4 rounded-2xl font-black text-sm transition-all duration-200 flex items-center justify-center gap-2">
              <span>Mulai Ujian Sekarang</span> <i class="fa-solid fa-rocket"></i>
            </button>
          </div>
        </template>

        <!-- ============================================== -->
        <!-- TAHAP 2: KUIS AKTIF (Desain Modern, Bersih, Nuansa Biru) -->
        <!-- ============================================== -->
        <template x-if="quizStage === 'active'">
          <div class="bg-white dark:bg-slate-900 p-8 md:p-10 rounded-3xl border border-slate-100 dark:border-slate-800 shadow-xl space-y-8 max-w-2xl mx-auto w-full transition-all duration-300">
            
            <div class="flex items-center justify-between border-b border-slate-100 dark:border-slate-800 pb-4 text-xs font-bold">
              <span class="text-slate-400 uppercase tracking-widest text-[11px] font-black">Soal <span class="text-blue-600 text-base" x-text="currentQuestionIndex + 1"></span> dari <span x-text="quizQuestions.length"></span></span>
              
              <div class="flex items-center gap-3">
                <button @click="finishQuiz()" class="px-3.5 py-2 bg-amber-500 hover:bg-amber-600 text-white text-xs font-bold rounded-xl transition shadow-sm flex items-center gap-1.5 cursor-pointer">
                  <i class="fa-solid fa-flag-checkered"></i> Selesai Ujian
                </button>
                <div class="flex items-center gap-2 font-mono text-sm px-3.5 py-2 bg-slate-50 dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 shadow-xs" :class="timeLeft <= 10 && quizTimeOption > 0 ? 'text-blue-600 animate-pulse font-bold' : 'text-slate-700 dark:text-slate-300'">
                  <i class="fa-regular fa-clock"></i>
                  <span x-text="quizTimeOption > 0 ? formatTime(timeLeft) : 'Bebas'"></span>
                </div>
              </div>
            </div>

            <!-- Progress Bar Elegan -->
            <div class="w-full bg-slate-100 dark:bg-slate-800 h-2.5 rounded-full overflow-hidden shadow-inner">
              <div class="bg-gradient-to-r from-blue-600 to-indigo-600 h-full transition-all duration-300 rounded-full" :style="`width: ${((currentQuestionIndex + 1) / quizQuestions.length) * 100}%`"></div>
            </div>

            <!-- Kartu Pertanyaan -->
            <div class="text-center py-12 px-6 bg-gradient-to-br from-blue-50/50 via-slate-50 to-indigo-50/30 dark:from-slate-800/40 dark:to-slate-900/40 rounded-3xl border border-slate-200/80 dark:border-slate-800 space-y-4 shadow-sm">
              <span class="text-[11px] uppercase tracking-widest font-black text-blue-600 dark:text-blue-400 bg-blue-100/80 dark:bg-blue-950/60 px-4 py-1.5 rounded-full border border-blue-200 dark:border-blue-900/50 inline-block shadow-2xs" x-text="currentQuestion.modeLabel"></span>
              <h3 class="text-4xl md:text-6xl font-black text-slate-900 dark:text-white font-serif tracking-tight" x-text="currentQuestion.question"></h3>
            </div>

            <!-- Pilihan Jawaban -->
            <div class="grid grid-cols-1 gap-4">
              <template x-for="(opt, idx) in currentQuestion.options" :key="idx">
                <button @click="selectAnswer(opt)" :disabled="selectedAnswer !== null" 
                        :class="{
                          'border-slate-200 dark:border-slate-800 hover:bg-blue-50/60 hover:border-blue-300 dark:hover:bg-slate-800/60 shadow-2xs': selectedAnswer === null, 
                          'bg-emerald-50 dark:bg-emerald-950/40 border-emerald-500 text-emerald-900 dark:text-emerald-200 font-bold shadow-sm': selectedAnswer !== null && opt.isCorrect, 
                          'bg-rose-50 dark:bg-rose-950/40 border-rose-500 text-rose-900 dark:text-rose-200 font-bold shadow-sm': selectedAnswer !== null && selectedAnswer === opt && !opt.isCorrect, 
                          'opacity-40 border-slate-200 dark:border-slate-800 shadow-none': selectedAnswer !== null && selectedAnswer !== opt && !opt.isCorrect
                        }" 
                        class="w-full text-left p-5 rounded-2xl border-2 transition-all duration-200 text-sm md:text-base font-bold flex items-center justify-between cursor-pointer">
                  <span x-text="opt.text"></span>
                  <template x-if="selectedAnswer !== null && opt.isCorrect"><i class="fa-solid fa-circle-check text-emerald-600 dark:text-emerald-400 text-xl"></i></template>
                  <template x-if="selectedAnswer !== null && selectedAnswer === opt && !opt.isCorrect"><i class="fa-solid fa-circle-xmark text-rose-600 dark:text-rose-400 text-xl"></i></template>
                </button>
              </template>
            </div>

            <div class="flex justify-end pt-3">
              <button x-show="selectedAnswer !== null" @click="nextQuestion()" class="px-8 py-4 bg-slate-900 dark:bg-white dark:text-slate-900 text-white font-black rounded-2xl text-xs uppercase tracking-wider hover:opacity-90 transition shadow-xl flex items-center gap-2.5 cursor-pointer">
                <span>Lanjut Soal</span> <i class="fa-solid fa-arrow-right text-[10px]"></i>
              </button>
            </div>

          </div>
        </template>

        <!-- ============================================== -->
        <!-- TAHAP 3: HASIL UJIAN (Desain Estetik, Nuansa Biru) -->
        <!-- ============================================== -->
        <template x-if="quizStage === 'result'">
          <div class="bg-white dark:bg-slate-900 p-8 md:p-12 rounded-3xl border border-slate-100 dark:border-slate-800 shadow-xl text-center space-y-6 max-w-md mx-auto w-full transition-all duration-300">
            <div class="w-20 h-20 bg-gradient-to-br from-blue-500 to-indigo-600 text-white rounded-3xl flex items-center justify-center mx-auto text-3xl font-bold shadow-lg shadow-blue-500/30">
              <i class="fa-solid fa-trophy"></i>
            </div>
            <div>
              <h2 class="text-2xl font-black text-slate-900 dark:text-white mb-1">Uji Pemahaman Selesai!</h2>
              <p class="text-xs text-slate-500 dark:text-slate-400">Kerja bagus! Berikut adalah rekapitulasi nilai ujian kamu.</p>
            </div>
            
            <div class="bg-slate-900 dark:bg-slate-950 text-white rounded-3xl p-7 shadow-xl space-y-1 relative overflow-hidden">
              <div class="absolute -right-6 -bottom-6 w-32 h-32 bg-blue-500/20 rounded-full blur-xl pointer-events-none"></div>
              <div class="text-[10px] uppercase tracking-widest text-slate-400 font-black">Nilai Akhir</div>
              <div class="text-6xl font-black text-blue-400" x-text="quizScore"></div>
            </div>

            <div class="grid grid-cols-3 gap-3 text-xs">
              <div class="p-4 bg-emerald-50 dark:bg-emerald-950/40 rounded-2xl border border-emerald-100 dark:border-emerald-900/50 shadow-xs">
                <div class="text-emerald-600 dark:text-emerald-400 font-extrabold text-[10px] uppercase">Benar</div>
                <div class="text-xl font-black text-emerald-700 dark:text-emerald-300 mt-1" x-text="correctCount"></div>
              </div>
              <div class="p-4 bg-rose-50 dark:bg-rose-950/40 rounded-2xl border border-rose-100 dark:border-rose-900/50 shadow-xs">
                <div class="text-rose-600 dark:text-rose-400 font-extrabold text-[10px] uppercase">Salah</div>
                <div class="text-xl font-black text-rose-700 dark:text-rose-300 mt-1" x-text="wrongCount"></div>
              </div>
              <div class="p-4 bg-blue-50 dark:bg-blue-950/40 rounded-2xl border border-blue-100 dark:border-blue-900/50 shadow-xs">
                <div class="text-blue-600 dark:text-blue-400 font-extrabold text-[10px] uppercase">Waktu</div>
                <div class="text-xs font-black text-blue-700 dark:text-blue-300 mt-1.5" x-text="formatTime(timeSpent)"></div>
              </div>
            </div>

            <button @click="resetQuiz()" class="w-full py-4 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-black rounded-2xl text-xs uppercase tracking-wider transition shadow-lg shadow-blue-500/25 cursor-pointer flex items-center justify-center gap-2">
              <span>Ulangi Ujian</span> <i class="fa-solid fa-rotate-right"></i>
            </button>
          </div>
        </template>

      </main>
    </div>
  </div>

  <!-- SCRIPT KUIS LENGKAP & MODERN -->
  <script>
    function quizApp() {
      return {
        sidebarOpen: false,
        materiAwalDropdown: false,
        kotobaDropdown: false,
        darkMode: false,

        availableCategories: [],
        selectedCategories: [],
        quizQuestionMode: 'indonesia',
        quizTimeOption: '0',
        quizLength: 10,
        maxAvailableQuestions: 0,

        quizStage: 'setup',
        quizQuestions: [],
        currentQuestionIndex: 0,
        currentQuestion: {},
        selectedAnswer: null,
        correctCount: 0,
        wrongCount: 0,
        quizScore: 0,
        timerInterval: null,
        timeLeft: 0,
        timeSpent: 0,

        async initApp() {
          this.initTheme();
          try {
            const sidebarRes = await fetch('./sidebar.html');
            if (sidebarRes.ok) {
              document.getElementById('sidebar-container').innerHTML = await sidebarRes.text();
              this.renderDynamicKotobaSubmenus();
            }
            const headerRes = await fetch('./header.html');
            if (headerRes.ok) {
              document.getElementById('header-container').innerHTML = await headerRes.text();
            }
          } catch (e) {
            console.error('Gagal memuat template modular:', e);
          }

          this.loadCategories();
        },

        loadCategories() {
          let baseCategories = [
            { key: 'kanji_list', title: 'Kanji Dasar (N5)' },
            { key: 'hiragana_list', title: 'Huruf Hiragana' },
            { key: 'katakana_list', title: 'Huruf Katakana' },
            { key: 'penanda_waktu_list', title: 'Penanda Waktu' },
            { key: 'ungkapan_waktu_list', title: 'Ungkapan Waktu' },
            { key: 'suuji_list', title: 'Kata Bilangan (Suuji)' }
          ];

          let customSubmenus = JSON.parse(localStorage.getItem('minna_submenus')) || [];
          let customKeys = customSubmenus.map(s => ({ key: s.id, title: s.title }));

          let merged = [...baseCategories, ...customKeys];
          let unique = Array.from(new Set(merged.map(a => a.key)))
            .map(key => merged.find(a => a.key === key));

          this.availableCategories = unique;
          // DEFAULT TIDAK ADA YANG DICENTANG KETIKA MASUK HALAMAN
          this.selectedCategories = [];
          this.updateMaxQuestions();
        },

        selectAllCategories() {
          this.selectedCategories = this.availableCategories.map(c => c.key);
          this.updateMaxQuestions();
        },

        deselectAllCategories() {
          this.selectedCategories = [];
          this.updateMaxQuestions();
        },

        updateMaxQuestions() {
          let vocabData = JSON.parse(localStorage.getItem('minna_vocab_data')) || {};
          let total = 0;
          this.selectedCategories.forEach(catKey => {
            let raw = this.getStaticMateri(catKey);
            if (raw.length > 0) {
              if (raw[0].items) {
                raw.forEach(sub => { total += sub.items.length; });
              } else {
                total += raw.length;
              }
            } else {
              let items = vocabData[catKey] || [];
              total += items.length;
            }
          });
          this.maxAvailableQuestions = total;
          if (this.quizLength > total && total > 0) {
            this.quizLength = total;
          } else if (total === 0) {
            this.quizLength = 0;
          }
        },

        startQuiz() {
          this.updateMaxQuestions();
          if (this.selectedCategories.length === 0) {
            alert('Silakan pilih minimal satu kategori materi terlebih dahulu!');
            return;
          }
          if (this.maxAvailableQuestions < 4) {
            alert('Total kosakata dari kategori yang dipilih kurang dari 4 item. Minimal butuh 4 item untuk kuis!');
            return;
          }

          let desiredLength = parseInt(this.quizLength);
          if (isNaN(desiredLength) || desiredLength <= 0) {
            alert('Jumlah soal tidak valid!');
            return;
          }

          let vocabData = JSON.parse(localStorage.getItem('minna_vocab_data')) || {};
          let categoryMap = {};

          this.selectedCategories.forEach(catKey => {
            let items = [];
            let raw = this.getStaticMateri(catKey);
            if (raw.length > 0) {
              if (raw[0].items) {
                raw.forEach(sub => { items = items.concat(sub.items); });
              } else {
                items = raw;
              }
            } else {
              items = vocabData[catKey] || [];
            }
            categoryMap[catKey] = items;
          });

          let masterPool = [];
          Object.keys(categoryMap).forEach(catKey => {
            categoryMap[catKey].forEach(it => {
              masterPool.push({ ...it, sourceCategory: catKey });
            });
          });

          const shuffled = [...masterPool].sort(() => 0.5 - Math.random());
          const limit = Math.min(desiredLength, shuffled.length);
          const selected = shuffled.slice(0, limit);

          this.quizQuestions = selected.map(item => {
            let mode = this.quizQuestionMode;
            if (mode === 'both') {
              mode = Math.random() < 0.5 ? 'indonesia' : 'romaji';
            }

            let isKanji = item.sourceCategory === 'kanji_list';
            let isHiragana = item.sourceCategory === 'hiragana_list';
            let isKatakana = item.sourceCategory === 'katakana_list';
            let isWaktu = item.sourceCategory === 'penanda_waktu_list' || item.sourceCategory === 'ungkapan_waktu_list';
            let isSuuji = item.sourceCategory === 'suuji_list';
            let questionText = '';
            let correctAnswerText = '';
            let modeLabel = '';

            if (isKanji) {
              questionText = item.kanji;
              correctAnswerText = `${item.arti} (${item.caraBaca})`;
              modeLabel = 'TEBAK ARTI & CARA BACA KANJI';
            } else if (isHiragana) {
              questionText = item.hiragana;
              correctAnswerText = item.romaji;
              modeLabel = 'TEBAK CARA BACA HIRAGANA (ROMAJI)';
            } else if (isKatakana) {
              questionText = item.katakana;
              correctAnswerText = item.romaji;
              modeLabel = 'TEBAK CARA BACA KATAKANA (ROMAJI)';
            } else if (isSuuji) {
              questionText = mode === 'indonesia' ? item.indonesia : item.romaji;
              correctAnswerText = mode === 'indonesia' ? `${item.romaji} (${item.hiragana})` : item.indonesia;
              modeLabel = mode === 'indonesia' ? 'Bahasa Indonesia (Suuji)' : 'Romaji (Suuji)';
            } else if (isWaktu) {
              questionText = mode === 'indonesia' ? item.indonesia : item.romaji;
              correctAnswerText = mode === 'indonesia' ? `${item.romaji} (${item.hiragana})` : item.indonesia;
              modeLabel = mode === 'indonesia' ? 'Bahasa Indonesia' : 'Romaji';
            } else {
              questionText = mode === 'indonesia' ? item.indonesia : item.romaji;
              correctAnswerText = mode === 'indonesia' ? `${item.romaji} (${item.hiragana || ''})` : item.indonesia;

        selectAnswer(opt) {
          if (this.selectedAnswer !== null) return;
          this.selectedAnswer = opt;
          if (opt.isCorrect) { this.correctCount++; } else { this.wrongCount++; }
        },

        nextQuestion() {
          if (this.currentQuestionIndex < this.quizQuestions.length - 1) {
            this.currentQuestionIndex++;
            this.currentQuestion = this.quizQuestions[this.currentQuestionIndex];
            this.selectedAnswer = null;
          } else {
            this.finishQuiz();
          }
        },

        finishQuiz() {
          clearInterval(this.timerInterval);
          let total = this.quizQuestions.length;
          let answered = this.correctCount + this.wrongCount;
          if (answered < total) {
            this.wrongCount += (total - answered);
          }
          this.quizScore = Math.round((this.correctCount / total) * 100);
          this.quizStage = 'result';
        },

        resetQuiz() {
          this.quizStage = 'setup';
          clearInterval(this.timerInterval);
          this.loadCategories();
        },

        formatTime(sec) {
          let m = Math.floor(sec / 60);
          let s = sec % 60;
          return `${m < 10 ? '0' + m : m}:${s < 10 ? '0' + s : s}`;
        },

        renderDynamicKotobaSubmenus() {
          const container = document.getElementById('dynamic-kotoba-links');
          if (!container) return;
          let submenus = JSON.parse(localStorage.getItem('minna_submenus')) || [];
          submenus.forEach(sub => {
            const link = document.createElement('a');
            link.href = `kotoba.html?cat=${sub.id}`;
            link.className = 'flex items-center gap-3 py-2.5 px-4 rounded-xl text-xs font-semibold text-slate-500 dark:text-slate-400 hover:text-blue-600 dark:hover:text-white hover:bg-slate-50 dark:hover:bg-slate-800/50 transition';
            link.innerHTML = `<i class="fa-solid fa-angle-right text-[10px]"></i> ${sub.title}`;
            container.appendChild(link);
          });
        },

        initTheme() {
          const savedTheme = localStorage.getItem('theme');
          if (savedTheme === 'dark') {
            this.darkMode = true;
            document.documentElement.classList.add('dark');
          } else {
            this.darkMode = false;
            document.documentElement.classList.remove('dark');
          }
        },
        
        toggleDarkMode() {
          this.darkMode = !this.darkMode;
          if (this.darkMode) {
            document.documentElement.classList.add('dark');
            localStorage.setItem('theme', 'dark');
          } else {
            document.documentElement.classList.remove('dark');
            localStorage.setItem('theme', 'light');
          }
        }
      }
