<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Uji Pemahaman - Minna no Nihongo</title>

  <!-- ======================================================
       TAILWIND CSS
       ====================================================== -->

  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      darkMode: 'class'
    };
  </script>


  <!-- ======================================================
       GOOGLE FONT
       ====================================================== -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
    rel="stylesheet">


  <!-- ======================================================
       ALPINE JS
       ====================================================== -->

  <script
    defer
    src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js">
  </script>


  <!-- ======================================================
       FONT AWESOME
       ====================================================== -->

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">


  <!-- ======================================================
       CUSTOM CSS
       ====================================================== -->

  <style>

    /* ======================================================
       GLOBAL
       ====================================================== */

    body {
      font-family: 'DM Sans', sans-serif;
    }

    [x-cloak] {
      display: none !important;
    }


    /* ======================================================
       ROMAJI / JAPANESE TEXT
       ====================================================== */

    .romaji-text {
      white-space: pre-wrap;
      word-break: break-word;
      overflow-wrap: anywhere;
    }


    /* ======================================================
       SCROLLBAR
       ====================================================== */

    ::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 999px;
    }

    .dark ::-webkit-scrollbar-thumb {
      background: #334155;
    }


    /* ======================================================
       QUIZ OPTION
       ====================================================== */

    .quiz-option {
      transform: translateY(0);
      min-height: 60px;
      box-sizing: border-box;

      transition:
        background-color 180ms ease,
        border-color 180ms ease,
        color 180ms ease,
        box-shadow 180ms ease,
        opacity 180ms ease,
        transform 180ms ease;
    }


    /* Hover hanya ketika belum menjawab */

    .quiz-option:hover:not(:disabled) {
      transform: translateY(-1px);
    }


    /* Saat ditekan */

    .quiz-option:active:not(:disabled) {
      transform: translateY(0);
    }


    /* ======================================================
       OPTION TEXT
       ====================================================== */

    .option-text {
      white-space: pre-wrap;
      word-break: break-word;
      overflow-wrap: anywhere;
      line-height: 1.5;
    }


    /* ======================================================
       QUESTION TEXT
       ====================================================== */

    .question-text {
      font-size: clamp(1.5rem, 4vw, 2.35rem);
      line-height: 1.25;
    }


    /* ======================================================
       MOBILE
       ====================================================== */

    @media (max-width: 640px) {

      .quiz-option {
        min-height: 58px;
      }

    }

  </style>

</head>


<body
  class="antialiased
         bg-[#F4F7FE]
         dark:bg-slate-950
         text-slate-700
         dark:text-slate-100
         transition-colors
         duration-300"

  x-data="quizApp()"
  x-init="initApp()"
>


  <div class="flex h-screen overflow-hidden">


    <!-- ======================================================
         MOBILE SIDEBAR OVERLAY
         ====================================================== -->

    <div
      x-show="sidebarOpen"
      @click="sidebarOpen = false"
      x-transition.opacity
      x-cloak
      class="fixed inset-0
             bg-slate-900/40
             backdrop-blur-sm
             z-40
             md:hidden">
    </div>


    <!-- ======================================================
         SIDEBAR
         ====================================================== -->

    <div
      id="sidebar-container"
      class="contents">
    </div>


    <!-- ======================================================
         MAIN CONTENT
         ====================================================== -->

    <div class="flex-1 flex flex-col min-w-0 overflow-hidden">


      <!-- ====================================================
           HEADER
           ==================================================== -->

      <div
        id="header-container"
        class="contents">
      </div>


      <!-- ====================================================
           BODY
           ==================================================== -->

      <main
        class="flex-1
               overflow-y-auto
               p-4
               md:p-8
               lg:p-10
               space-y-5">


        <!-- ==================================================
             PAGE HEADER
             ================================================== -->

        <div
          class="bg-gradient-to-r
                 from-blue-600
                 via-indigo-600
                 to-blue-700
                 p-5
                 md:p-7
                 rounded-3xl
                 text-white
                 shadow-xl
                 flex
                 flex-col
                 md:flex-row
                 justify-between
                 items-center
                 gap-5">


          <!-- LEFT -->

          <div
            class="space-y-1.5
                   flex-1
                   min-w-0">

            <span
              class="bg-white/20
                     backdrop-blur-md
                     px-3
                     py-1
                     rounded-full
                     text-[10px]
                     font-extrabold
                     uppercase
                     tracking-widest
                     border
                     border-white/20
                     inline-block
                     shadow-sm">

              <i class="fa-solid fa-brain mr-1"></i>

              Ujian Interaktif

            </span>


            <h2
              class="text-lg
                     md:text-2xl
                     font-black
                     tracking-tight">

              Uji Pemahaman Bahasa Jepang

            </h2>


            <p
              class="text-xs
                     text-blue-100
                     max-w-xl
                     leading-relaxed">

              Uji kemampuan dari seluruh materi Kotoba,
              kategori, dan bab yang telah tersimpan di sistem.

            </p>

          </div>


          <!-- TOTAL BANK SOAL -->

          <div
            class="bg-white/10
                   backdrop-blur-md
                   border
                   border-white/20
                   px-4
                   py-3
                   rounded-2xl
                   flex
                   items-center
                   gap-3
                   shrink-0
                   shadow-inner">

            <div
              class="w-10
                     h-10
                     rounded-xl
                     bg-white/20
                     flex
                     items-center
                     justify-center
                     text-base
                     font-bold">

              <i class="fa-solid fa-database"></i>

            </div>


            <div>

              <div
                class="text-[9px]
                       text-blue-200
                       font-bold
                       uppercase
                       tracking-wider">

                Total Bank Soal

              </div>


              <div
                class="text-sm
                       font-black"
                x-text="maxAvailableQuestions + ' Soal'">
              </div>

            </div>

          </div>

        </div>


        <!-- ==================================================
             STAGE 1 : SETUP
             ================================================== -->

        <template x-if="quizStage === 'setup'">

          <div
            class="bg-white
                   dark:bg-slate-900
                   p-6
                   md:p-8
                   rounded-3xl
                   border
                   border-slate-100
                   dark:border-slate-800
                   shadow-xl
                   space-y-7
                   max-w-2xl
                   mx-auto
                   w-full
                   transition-all
                   duration-300">


            <!-- SETUP HEADER -->

            <div
              class="flex
                     items-center
                     justify-between
                     gap-3
                     border-b
                     border-slate-100
                     dark:border-slate-800
                     pb-4">

              <div
                class="flex
                       items-center
                       gap-3">

                <div
                  class="w-9
                         h-9
                         rounded-xl
                         bg-blue-50
                         dark:bg-blue-950/50
                         text-blue-600
                         flex
                         items-center
                         justify-center
                         text-xs
                         shadow-sm">

                  <i class="fa-solid fa-sliders"></i>

                </div>


                <h4
                  class="text-sm
                         font-black
                         text-slate-900
                         dark:text-white
                         uppercase
                         tracking-wider">

                  Konfigurasi Ujian

                </h4>

              </div>


              <div
                class="hidden
                       sm:flex
                       items-center
                       gap-2">

                <button
                  @click="selectAllCategories()"
                  class="text-[10px]
                         font-bold
                         text-blue-600
                         dark:text-blue-400
                         hover:underline
                         cursor-pointer">

                  Pilih Semua

                </button>


                <span
                  class="text-slate-300
                         dark:text-slate-700">

                  |

                </span>


                <button
                  @click="deselectAllCategories()"
                  class="text-[10px]
                         font-bold
                         text-slate-400
                         hover:underline
                         cursor-pointer">

                  Batal Semua

                </button>

              </div>

            </div>


            <!-- =================================================
                 KATEGORI
                 ================================================= -->

            <div class="space-y-3">

              <div
                class="flex
                       items-center
                       justify-between">

                <label
                  class="block
                         text-xs
                         font-bold
                         text-slate-400
                         dark:text-slate-500
                         uppercase
                         tracking-wider">

                  Pilih Kategori Materi

                </label>


                <span
                  class="text-[10px]
                         font-bold
                         text-blue-600
                         dark:text-blue-400">

                  <span
                    x-text="selectedCategories.length">
                  </span>

                  dipilih

                </span>

              </div>


              <div
                class="grid
                       grid-cols-1
                       sm:grid-cols-2
                       gap-3
                       max-h-60
                       overflow-y-auto
                       pr-1">

                <template
                  x-for="cat in availableCategories"
                  :key="cat.key">

                  <label
                    :class="
                      selectedCategories.includes(cat.key)
                        ? 'border-blue-500 bg-blue-50/60 dark:bg-blue-950/25 shadow-sm'
                        : 'border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 hover:bg-slate-50 dark:hover:bg-slate-800/50'
                    "

                    class="flex
                           items-center
                           p-3.5
                           rounded-2xl
                           border-2
                           cursor-pointer
                           transition-all
                           duration-200">

                    <input
                      type="checkbox"
                      :value="cat.key"
                      x-model="selectedCategories"
                      @change="updateMaxQuestions()"
                      class="w-4
                             h-4
                             text-blue-600
                             rounded
                             border-slate-300
                             focus:ring-blue-500
                             cursor-pointer">


                    <span
                      class="ml-3
                             text-xs
                             text-slate-700
                             dark:text-slate-300
                             font-bold"

                      x-text="cat.title">
                    </span>

                  </label>

                </template>

              </div>


              <!-- EMPTY CATEGORY -->

              <template
                x-if="availableCategories.length === 0">

                <div
                  class="p-4
                         rounded-2xl
                         bg-amber-50
                         dark:bg-amber-950/30
                         border
                         border-amber-100
                         dark:border-amber-900/50
                         text-[11px]
                         text-amber-700
                         dark:text-amber-300">

                  <div
                    class="flex
                           items-start
                           gap-3">

                    <i
                      class="fa-solid
                             fa-circle-info
                             mt-0.5">
                    </i>


                    <div>

                      <p class="font-bold">

                        Belum ada kategori materi

                      </p>


                      <p class="mt-1">

                        Tambahkan kategori Kotoba terlebih dahulu
                        melalui menu pengelolaan materi.

                      </p>

                    </div>

                  </div>

                </div>

              </template>

            </div>


            <!-- =================================================
                 FORMAT PERTANYAAN
                 ================================================= -->

            <div class="space-y-3">

              <label
                class="block
                       text-xs
                       font-bold
                       text-slate-400
                       dark:text-slate-500
                       uppercase
                       tracking-wider">

                Format Pertanyaan

              </label>


              <div
                class="grid
                       grid-cols-1
                       sm:grid-cols-3
                       gap-3
                       text-xs
                       font-semibold">


                <!-- INDONESIA -->

                <label
                  :class="
                    quizQuestionMode === 'indonesia'
                      ? 'border-blue-500 bg-blue-50/60 dark:bg-blue-950/25'
                      : 'border-slate-200 dark:border-slate-800'
                  "

                  class="flex
                         items-center
                         p-4
                         rounded-2xl
                         border-2
                         cursor-pointer
                         transition-all">

                  <input
                    type="radio"
                    value="indonesia"
                    x-model="quizQuestionMode"
                    class="w-4
                           h-4
                           text-blue-600
                           focus:ring-blue-500
                           cursor-pointer">


                  <span
                    class="ml-2.5
                           text-slate-700
                           dark:text-slate-300
                           font-bold">

                    Bahasa Indonesia

                  </span>

                </label>


                <!-- ROMAJI -->

                <label
                  :class="
                    quizQuestionMode === 'romaji'
                      ? 'border-blue-500 bg-blue-50/60 dark:bg-blue-950/25'
                      : 'border-slate-200 dark:border-slate-800'
                  "

                  class="flex
                         items-center
                         p-4
                         rounded-2xl
                         border-2
                         cursor-pointer
                         transition-all">

                  <input
                    type="radio"
                    value="romaji"
                    x-model="quizQuestionMode"
                    class="w-4
                           h-4
                           text-blue-600
                           focus:ring-blue-500
                           cursor-pointer">


                  <span
                    class="ml-2.5
                           text-slate-700
                           dark:text-slate-300
                           font-bold">

                    Romaji

                  </span>

                </label>


                <!-- BOTH -->

                <label
                  :class="
                    quizQuestionMode === 'both'
                      ? 'border-blue-500 bg-blue-50/60 dark:bg-blue-950/25'
                      : 'border-slate-200 dark:border-slate-800'
                  "

                  class="flex
                         items-center
                         p-4
                         rounded-2xl
                         border-2
                         cursor-pointer
                         transition-all">

                  <input
                    type="radio"
                    value="both"
                    x-model="quizQuestionMode"
                    class="w-4
                           h-4
                           text-blue-600
                           focus:ring-blue-500
                           cursor-pointer">


                  <span
                    class="ml-2.5
                           text-slate-700
                           dark:text-slate-300
                           font-bold">

                    Acak Keduanya

                  </span>

                </label>

              </div>

            </div>


            <!-- =================================================
                 WAKTU + JUMLAH SOAL
                 ================================================= -->

            <div
              class="grid
                     grid-cols-1
                     sm:grid-cols-2
                     gap-4
                     text-xs">


              <!-- TIME -->

              <div class="space-y-2">

                <label
                  class="block
                         font-bold
                         text-slate-400
                         dark:text-slate-500
                         uppercase
                         tracking-wider">

                  Batas Waktu

                </label>


                <select
                  x-model="quizTimeOption"
                  class="w-full
                         p-4
                         rounded-2xl
                         border-2
                         border-slate-200
                         dark:border-slate-800
                         bg-slate-50
                         dark:bg-slate-950
                         font-bold
                         focus:outline-none
                         focus:border-blue-500
                         transition">

                  <option value="0">
                    Tanpa Batas Waktu
                  </option>

                  <option value="1">
                    1 Menit
                  </option>

                  <option value="3">
                    3 Menit
                  </option>

                  <option value="5">
                    5 Menit
                  </option>

                </select>

              </div>


              <!-- QUESTION COUNT -->

              <div class="space-y-2">

                <div
                  class="flex
                         justify-between
                         items-center
                         gap-2">

                  <label
                    class="block
                           font-bold
                           text-slate-400
                           dark:text-slate-500
                           uppercase
                           tracking-wider">

                    Jumlah Soal

                  </label>


                  <span
                    class="text-[10px]
                           text-blue-600
                           dark:text-blue-400
                           font-black
                           whitespace-nowrap"

                    x-text="'Maks. ' + maxAvailableQuestions">
                  </span>

                </div>


                <input
                  type="number"
                  min="1"
                  :max="maxAvailableQuestions"
                  x-model.number="quizLength"

                  class="w-full
                         p-4
                         rounded-2xl
                         border-2
                         border-slate-200
                         dark:border-slate-800
                         bg-slate-50
                         dark:bg-slate-950
                         font-bold
                         focus:outline-none
                         focus:border-blue-500
                         transition">

              </div>

            </div>


            <!-- =================================================
                 START BUTTON
                 ================================================= -->

            <button
              @click="startQuiz()"

              :disabled="selectedCategories.length === 0"

              :class="
                selectedCategories.length === 0
                  ? 'bg-slate-300 dark:bg-slate-800 text-slate-400 cursor-not-allowed shadow-none'
                  : 'bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white shadow-xl shadow-blue-500/25 cursor-pointer'
              "

              class="w-full
                     py-4
                     rounded-2xl
                     font-black
                     text-sm
                     transition-all
                     duration-200
                     flex
                     items-center
                     justify-center
                     gap-2">

              <span>
                Mulai Ujian Sekarang
              </span>

              <i class="fa-solid fa-rocket"></i>

            </button>

          </div>

        </template>


        <!-- ==================================================
             STAGE 2 : ACTIVE QUIZ
             ================================================== -->

        <template x-if="quizStage === 'active'">

          <div
            class="bg-white
                   dark:bg-slate-900
                   p-5
                   md:p-7
                   rounded-3xl
                   border
                   border-slate-100
                   dark:border-slate-800
                   shadow-xl
                   space-y-6
                   max-w-2xl
                   mx-auto
                   w-full
                   transition-all
                   duration-300">


            <!-- =================================================
                 TOP BAR
                 ================================================= -->

            <div
              class="flex
                     items-center
                     justify-between
                     gap-3
                     border-b
                     border-slate-100
                     dark:border-slate-800
                     pb-4">


              <!-- QUESTION NUMBER -->

              <div
                class="text-slate-400
                       dark:text-slate-500
                       uppercase
                       tracking-widest
                       text-[10px]
                       md:text-[11px]
                       font-black">

                Soal

                <span
                  class="text-blue-600
                         dark:text-blue-400
                         text-base"

                  x-text="currentQuestionIndex + 1">
                </span>

                dari

                <span
                  x-text="quizQuestions.length">
                </span>

              </div>


              <!-- RIGHT -->

              <div
                class="flex
                       items-center
                       gap-2">


                <!-- TIMER -->

                <div
                  class="flex
                         items-center
                         gap-1.5
                         px-3
                         py-2
                         bg-slate-50
                         dark:bg-slate-800
                         border
                         border-slate-200
                         dark:border-slate-700
                         rounded-xl
                         text-[10px]
                         md:text-xs
                         font-black"

                  :class="
                    timeLeft <= 10 && quizTimeOption > 0
                      ? 'text-rose-600 animate-pulse'
                      : 'text-slate-500 dark:text-slate-300'
                  ">

                  <i class="fa-regular fa-clock"></i>

                  <span
                    x-text="
                      quizTimeOption > 0
                        ? formatTime(timeLeft)
                        : 'Bebas'
                    ">
                  </span>

                </div>


                <!-- FINISH -->

                <button
                  @click="finishQuiz()"

                  class="px-3
                         py-2
                         bg-amber-500
                         hover:bg-amber-600
                         text-white
                         text-[10px]
                         md:text-xs
                         font-bold
                         rounded-xl
                         transition
                         shadow-sm
                         flex
                         items-center
                         gap-1.5
                         cursor-pointer
                         shrink-0">

                  <i
                    class="fa-solid fa-flag-checkered">
                  </i>


                  <span class="hidden sm:inline">
                    Selesai Ujian
                  </span>


                  <span class="sm:hidden">
                    Selesai
                  </span>

                </button>

              </div>

            </div>


            <!-- =================================================
                 PROGRESS
                 ================================================= -->

            <div>

              <div
                class="flex
                       items-center
                       justify-between
                       mb-2">

                <span
                  class="text-[9px]
                         font-black
                         uppercase
                         tracking-widest
                         text-slate-400
                         dark:text-slate-500">

                  Progress

                </span>


                <span
                  class="text-[9px]
                         font-black
                         text-blue-600
                         dark:text-blue-400"

                  x-text="
                    Math.round(
                      ((currentQuestionIndex + 1)
                      / quizQuestions.length) * 100
                    ) + '%'
                  ">
                </span>

              </div>


              <div
                class="w-full
                       bg-slate-100
                       dark:bg-slate-800
                       h-2
                       rounded-full
                       overflow-hidden
                       shadow-inner">

                <div
                  class="bg-gradient-to-r
                         from-blue-600
                         to-indigo-600
                         h-full
                         transition-all
                         duration-300
                         rounded-full"

                  :style="
                    `width: ${
                      ((currentQuestionIndex + 1)
                      / quizQuestions.length) * 100
                    }%`
                  ">
                </div>

              </div>

            </div>


            <!-- =================================================
                 QUESTION CARD
                 ================================================= -->

            <div
              class="relative
                     text-center
                     px-5
                     py-6
                     md:px-8
                     md:py-7
                     bg-gradient-to-br
                     from-blue-50/70
                     via-white
                     to-indigo-50/50
                     dark:from-slate-800/60
                     dark:via-slate-900
                     dark:to-slate-800/60
                     rounded-3xl
                     border
                     border-blue-100/80
                     dark:border-slate-800
                     shadow-sm
                     overflow-hidden">


              <!-- Decorative -->

              <div
                class="absolute
                       -top-12
                       -right-12
                       w-28
                       h-28
                       bg-blue-500/10
                       rounded-full
                       blur-2xl
                       pointer-events-none">
              </div>


              <!-- MODE LABEL -->

              <div
                class="relative
                       inline-flex
                       items-center
                       gap-2
                       text-[9px]
                       md:text-[10px]
                       uppercase
                       tracking-wider
                       font-black
                       text-blue-600
                       dark:text-blue-400
                       bg-blue-100/80
                       dark:bg-blue-950/60
                       px-3
                       md:px-3.5
                       py-1.5
                       rounded-full
                       border
                       border-blue-200
                       dark:border-blue-900/50
                       shadow-sm
                       mb-3">

                <i
                  class="fa-solid fa-language text-[10px]">
                </i>


                <span
                  x-text="currentQuestion.modeLabel">
                </span>

              </div>


              <!-- QUESTION -->

              <div
                class="relative
                       flex
                       items-center
                       justify-center
                       min-h-[85px]
                       md:min-h-[105px]
                       px-1">

                <h3
                  class="question-text
                         max-w-full
                         font-black
                         text-slate-900
                         dark:text-white
                         tracking-tight
                         break-words
                         [overflow-wrap:anywhere]"

                  x-text="currentQuestion.question">
                </h3>

              </div>


              <!-- DESCRIPTION -->

              <div
                class="relative
                       flex
                       items-center
                       justify-center
                       gap-2
                       mt-3
                       text-[10px]
                       md:text-xs
                       text-slate-500
                       dark:text-slate-400
                       leading-relaxed">

                <span
                  class="w-7
                         h-7
                         rounded-lg
                         bg-white
                         dark:bg-slate-800
                         border
                         border-slate-200
                         dark:border-slate-700
                         flex
                         items-center
                         justify-center
                         text-blue-500
                         shadow-sm
                         shrink-0">

                  <i
                    class="fa-solid
                           fa-lightbulb
                           text-[10px]">
                  </i>

                </span>


                <span
                  x-text="
                    currentQuestion.questionHint ||
                    'Pilih jawaban yang paling tepat.'
                  ">
                </span>

              </div>

            </div>


            <!-- =================================================
                 OPTIONS
                 ================================================= -->

            <div class="space-y-3">


              <!-- LABEL -->

              <div

  <script>

    function quizApp() {

      return {

        /* ==================================================
           STATE
           ================================================== */

        sidebarOpen: false,

        materiAwalDropdown: false,

        kotobaDropdown: false,

        darkMode: false,


        availableCategories: [],

        selectedCategories: [],


        quizQuestionMode: 'indonesia',

        quizTimeOption: '0',

        quizLength: 10,

        maxAvailableQuestions: 0,


        quizStage: 'setup',

        quizQuestions: [],

        currentQuestionIndex: 0,

        currentQuestion: {},


        selectedAnswer: null,


        correctCount: 0,

        wrongCount: 0,


        quizScore: 0,


        timerInterval: null,

        timeLeft: 0,

        timeSpent: 0,


        quizFinished: false,


        /* ==================================================
           INITIALIZATION
           ================================================== */

        async initApp() {

          this.initTheme();


          try {

            const sidebarRes =
              await fetch('./sidebar.html');


            if (sidebarRes.ok) {

              document
                .getElementById('sidebar-container')
                .innerHTML =
                await sidebarRes.text();


              this.renderDynamicKotobaSubmenus();

            }


            const headerRes =
              await fetch('./header.html');


            if (headerRes.ok) {

              document
                .getElementById('header-container')
                .innerHTML =
                await headerRes.text();

            }

          } catch (e) {

            console.error(
              'Gagal memuat template modular:',
              e
            );

          }


          this.loadCategories();

        },


        /* ==================================================
           LOAD CATEGORIES
           ================================================== */

        loadCategories() {

          let customSubmenus =
            JSON.parse(
              localStorage.getItem(
                'minna_submenus'
              )
            ) || [];


          let merged =
            customSubmenus.map(s => ({

              key: s.id,

              title: s.title

            }));


          this.availableCategories =
            merged;


          this.selectedCategories =
            [];


          this.updateMaxQuestions();

        },


        /* ==================================================
           CATEGORY CONTROL
           ================================================== */

        selectAllCategories() {

          this.selectedCategories =
            this.availableCategories.map(
              c => c.key
            );


          this.updateMaxQuestions();

        },


        deselectAllCategories() {

          this.selectedCategories =
            [];


          this.updateMaxQuestions();

        },


        /* ==================================================
           UPDATE MAX QUESTIONS
           ================================================== */

        updateMaxQuestions() {

          let vocabData =
            JSON.parse(
              localStorage.getItem(
                'minna_vocab_data'
              )
            ) || {};


          let total = 0;


          this.selectedCategories.forEach(
            catKey => {

              let items =
                vocabData[catKey] || [];


              total += items.length;

            }
          );


          this.maxAvailableQuestions =
            total;


          if (
            this.quizLength > total &&
            total > 0
          ) {

            this.quizLength =
              total;

          } else if (
            total === 0
          ) {

            this.quizLength =
              0;

          }

        },


        /* ==================================================
           START QUIZ
           ================================================== */

        startQuiz() {

          this.updateMaxQuestions();


          if (
            this.selectedCategories.length === 0
          ) {

            alert(
              'Silakan pilih minimal satu kategori materi terlebih dahulu!'
            );

            return;

          }


          if (
            this.maxAvailableQuestions < 4
          ) {

            alert(
              'Total kosakata dari kategori yang dipilih kurang dari 4 item. Minimal butuh 4 item untuk kuis!'
            );

            return;

          }


          let desiredLength =
            parseInt(
              this.quizLength
            );


          if (
            isNaN(desiredLength) ||
            desiredLength <= 0
          ) {

            alert(
              'Jumlah soal tidak valid!'
            );

            return;

          }


          let vocabData =
            JSON.parse(
              localStorage.getItem(
                'minna_vocab_data'
              )
            ) || {};


          let categoryMap = {};


          this.selectedCategories.forEach(
            catKey => {

              categoryMap[catKey] =
                vocabData[catKey] || [];

            }
          );


          /* =================================================
             MASTER POOL
             ================================================= */

          let masterPool = [];


          Object.keys(categoryMap).forEach(
            catKey => {

              categoryMap[catKey].forEach(
                it => {

                  masterPool.push({

                    ...it,

                    sourceCategory:
                      catKey

                  });

                }
              );

            }
          );


          /* =================================================
             SHUFFLE
             ================================================= */

          const shuffled =
            [...masterPool]
              .sort(
                () =>
                  0.5 -
                  Math.random()
              );


          const limit =
            Math.min(
              desiredLength,
              shuffled.length
            );


          const selected =
            shuffled.slice(
              0,
              limit
            );


          /* =================================================
             CREATE QUESTIONS
             ================================================= */

          this.quizQuestions =
            selected.map(item => {

              let mode =
                this.quizQuestionMode;


              if (
                mode === 'both'
              ) {

                mode =
                  Math.random() < 0.5
                    ? 'indonesia'
                    : 'romaji';

              }


              let questionText =
                mode === 'indonesia'
                  ? item.indonesia
                  : item.romaji;


              let correctAnswerText =
                mode === 'indonesia'

                  ? `${item.romaji} (${item.hiragana || ''})`

                  : item.indonesia;


              let modeLabel =
                mode === 'indonesia'

                  ? 'Bahasa Indonesia → Jepang'

                  : 'Romaji → Indonesia';


              let questionHint =
                mode === 'indonesia'

                  ? 'Pilih kosakata bahasa Jepang yang tepat.'

                  : 'Tentukan arti bahasa Indonesia yang sesuai.';


              /* =================================================
                 SAME CATEGORY DISTRACTORS
                 ================================================= */

              let sameCategoryItems =
                categoryMap[
                  item.sourceCategory
                ] || [];


              let distractors =
                sameCategoryItems

                  .filter(
                    p =>
                      p.romaji !==
                      item.romaji
                  )

                  .sort(
                    () =>
                      0.5 -
                      Math.random()
                  )

                  .slice(
                    0,
                    3
                  )

                  .map(
                    d =>

                      mode === 'indonesia'

                        ? `${d.romaji} (${d.hiragana || ''})`

                        : d.indonesia
                  );


              /* =================================================
                 EXTRA DISTRACTORS
                 ================================================= */

              if (
                distractors.length < 3
              ) {

                let extra =
                  masterPool

                    .filter(
                      p =>
                        p.romaji !==
                        item.romaji
                    )

                    .sort(
                      () =>
                        0.5 -
                        Math.random()
                    )

                    .slice(
                      0,
                      3 -
                      distractors.length
                    )

                    .map(
                      d =>

                        mode === 'indonesia'

                          ? `${d.romaji} (${d.hiragana || ''})`

                          : d.indonesia
                    );


                distractors =
                  distractors.concat(
                    extra
                  );

              }


              /* =================================================
                 OPTIONS
                 ================================================= */

              let options = [

                {
                  text:
                    correctAnswerText,

                  isCorrect:
                    true
                },

                ...distractors.map(
                  dText => ({

                    text:
                      dText,

                    isCorrect:
                      false

                  })
                )

              ];


              /* Shuffle options */

              options =
                options.sort(
                  () =>
                    0.5 -
                    Math.random()
                );


              return {

                question:
                  questionText,

                correctAnswer:
                  correctAnswerText,

                options:
                  options,

                modeLabel:
                  modeLabel,

                questionHint:
                  questionHint

              };

            });


          /* =================================================
             RESET STATE
             ================================================= */

          this.currentQuestionIndex =
            0;


          this.currentQuestion =
            this.quizQuestions[0];


          this.selectedAnswer =
            null;


          this.correctCount =
            0;


          this.wrongCount =
            0;


          this.quizScore =
            0;


          this.quizFinished =
            false;


          this.timeSpent =
            0;


          /* =================================================
             TIMER
             ================================================= */

          let mins =
            parseInt(
              this.quizTimeOption
            );


          this.timeLeft =
            mins > 0
              ? mins * 60
              : 0;


          this.quizStage =
            'active';


          clearInterval(
            this.timerInterval
          );


          if (
            mins > 0
          ) {

            this.timerInterval =
              setInterval(() => {

                if (
                  this.quizStage !==
                  'active'
                ) {

                  clearInterval(
                    this.timerInterval
                  );

                  return;

                }


                this.timeSpent++;

                this.timeLeft--;


                if (
                  this.timeLeft <= 0
                ) {

                  this.finishQuiz();

                }

              }, 1000);

          } else {

            this.timerInterval =
              setInterval(() => {

                if (
                  this.quizStage !==
                  'active'
                ) {

                  clearInterval(
                    this.timerInterval
                  );

                  return;

                }


                this.timeSpent++;

              }, 1000);

          }

        },


        /* ==================================================
           SELECT ANSWER
           ================================================== */

        selectAnswer(opt) {

          if (
            this.selectedAnswer !== null ||
            this.quizStage !== 'active'
          ) {

            return;

          }


          this.selectedAnswer =
            opt;


          if (
            opt.isCorrect
          ) {

            this.correctCount++;

          } else {

            this.wrongCount++;

          }

        },


        /* ==================================================
           NEXT QUESTION
           ================================================== */

        nextQuestion() {

          if (
            this.currentQuestionIndex <
            this.quizQuestions.length - 1
          ) {

            this.currentQuestionIndex++;


            this.currentQuestion =
              this.quizQuestions[
                this.currentQuestionIndex
              ];


            this.selectedAnswer =
              null;

          } else {

            this.finishQuiz();

          }

        },


        /* ==================================================
           FINISH
           ================================================== */

        finishQuiz() {

          if (
            this.quizFinished ||
            this.quizStage !== 'active'
          ) {

            return;

          }


          this.quizFinished =
            true;


          clearInterval(
            this.timerInterval
          );


          let total =
            this.quizQuestions.length;


          if (
            total === 0
          ) {

            return;

          }


          let answered =
            this.correctCount +
            this.wrongCount;


          if (
            answered < total
          ) {

            this.wrongCount +=
              total -
              answered;

          }


          this.quizScore =
            Math.round(
              (
                this.correctCount /
                total
              ) * 100
            );


          this.quizStage =
            'result';

        },


        /* ==================================================
           RESET
           ================================================== */

        resetQuiz() {

          clearInterval(
            this.timerInterval
          );


          this.quizStage =
            'setup';


          this.quizQuestions =
            [];


          this.currentQuestion =
            {};


          this.currentQuestionIndex =
            0;


          this.selectedAnswer =
            null;


          this.correctCount =
            0;


          this.wrongCount =
            0;


          this.quizScore =
            0;


          this.timeLeft =
            0;


          this.timeSpent =
            0;


          this.quizFinished =
            false;


          this.loadCategories();

        },


        /* ==================================================
           FORMAT TIME
           ================================================== */

        formatTime(sec) {

          let m =
            Math.floor(
              sec / 60
            );


          let s =
            sec % 60;


          return `${
            m < 10
              ? '0' + m
              : m
          }:${
            s < 10
              ? '0' + s
              : s
          }`;

        },


        /* ==================================================
           DYNAMIC KOTOBA
           ================================================== */

        renderDynamicKotobaSubmenus() {

          const container =
            document.getElementById(
              'dynamic-kotoba-links'
            );


          if (!container) return;


          let submenus =
            JSON.parse(
              localStorage.getItem(
                'minna_submenus'
              )
            ) || [];


          /* Bersihkan agar tidak duplicate */

          container.innerHTML =
            '';


          submenus.forEach(
            sub => {

              const link =
                document.createElement(
                  'a'
                );


              link.href =
                `kotoba.html?cat=${sub.id}`;


              link.className =
                'flex items-center gap-3 py-2.5 px-4 rounded-xl text-xs font-semibold text-slate-500 dark:text-slate-400 hover:text-blue-600 dark:hover:text-white hover:bg-slate-50 dark:hover:bg-slate-800/50 transition';


              link.innerHTML =
                `<i class="fa-solid fa-angle-right text-[10px]"></i> ${sub.title}`;


              container.appendChild(
                link
              );

            }
          );

        },


        /* ==================================================
           THEME
           ================================================== */

        initTheme() {

          const savedTheme =
            localStorage.getItem(
              'theme'
            );


          if (
            savedTheme === 'dark'
          ) {

            this.darkMode =
              true;


            document.documentElement
              .classList
              .add('dark');

          } else {

            this.darkMode =
              false;


            document.documentElement
              .classList
              .remove('dark');

          }

        },


        /* ==================================================
           TOGGLE DARK MODE
           ================================================== */

        toggleDarkMode() {

          this.darkMode =
            !this.darkMode;


          if (
            this.darkMode
          ) {

            document.documentElement
              .classList
              .add('dark');


            localStorage.setItem(
              'theme',
              'dark'
            );

          } else {

            document.documentElement
              .classList
              .remove('dark');


            localStorage.setItem(
              'theme',
              'light'
            );

          }

        }

      };

    }

  </script>

</body>

</html>
