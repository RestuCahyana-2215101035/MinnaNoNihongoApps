<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Minna no Nihongo - Kanji Dasar</title>
  
  <!-- Style Anti-Flicker Alpine & Fix Scrolling iOS -->
  <style>
    [x-cloak] { display: none !important; }
    body { font-family: 'DM Sans', sans-serif; }
    .-webkit-overflow-scrolling-touch {
      -webkit-overflow-scrolling: touch;
    }
  </style>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>

  <!-- Google Fonts: DM Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
  
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Alpine.js (Loaded Deferred) -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="antialiased bg-[#F4F7FE] dark:bg-slate-950 text-slate-700 dark:text-slate-100 transition-colors duration-300" x-data="kanjiApp()" x-init="initApp()">

  <!-- Layout Wrapper menggunakan 100dvh untuk kalkulasi tepat di Dynamic Toolbar iOS Safari -->
  <div class="flex h-screen h-[100dvh] overflow-hidden relative">
    
    <!-- Mobile Sidebar Overlay -->
    <div x-show="sidebarOpen" 
         @click="sidebarOpen = false" 
         x-cloak
         class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs z-40 md:hidden transition-opacity" 
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         x-transition:leave="transition ease-in duration-200"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0"></div>

    <!-- SIDEBAR CONTAINER (Optimasi Flexbox & Z-Index Khusus Safari WebKit) -->
    <div id="sidebar-container" class="relative z-50 h-full flex shrink-0"></div>

    <!-- MAIN CONTENT AREA -->
    <div class="flex-1 flex flex-col min-w-0 overflow-hidden w-full">
      
      <!-- HEADER CONTAINER -->
      <div id="header-container" class="shrink-0 w-full z-30"></div>

      <!-- MAIN BODY CONTENT -->
      <main class="flex-1 overflow-y-auto p-4 md:p-8 space-y-6 md:space-y-8 -webkit-overflow-scrolling-touch">
        
        <!-- Header Halaman -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-white dark:bg-slate-900 p-6 rounded-3xl border border-slate-100 dark:border-slate-800 shadow-2xs">
          <div>
            <h3 class="text-base font-bold text-slate-900 dark:text-white mb-1">Daftar Kanji Dasar (漢字)</h3>
            <p class="text-xs text-slate-500 dark:text-slate-400">Kartu belajar Kanji lengkap dengan cara baca Kun'yomi/On'yomi serta contoh kata tingkat dasar (N5).</p>
          </div>
          <span class="text-xs bg-blue-50 dark:bg-blue-950/50 text-blue-600 dark:text-blue-400 font-bold px-4 py-2 rounded-xl border border-blue-100 dark:border-blue-900/50" x-text="kanjiList.length + ' Karakter Kanji'"></span>
        </div>

        <!-- GRID KARTU KANJI -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-5 pb-12">
          <template x-for="item in kanjiList" :key="item.id">
            <div class="bg-white dark:bg-slate-900 rounded-3xl border border-slate-100 dark:border-slate-800 shadow-sm hover:shadow-md transition overflow-hidden flex flex-col">
              
              <!-- Card Header -->
              <div class="bg-slate-900 dark:bg-slate-800 text-white p-4 px-6 flex items-center justify-between">
                <div class="flex items-center gap-3">
                  <span class="text-xs bg-blue-600 text-white font-mono px-2.5 py-0.5 rounded-lg" x-text="'#' + item.id"></span>
                  <h3 class="text-3xl font-extrabold font-serif text-blue-400" x-text="item.kanji"></h3>
                </div>
                <div class="text-right">
                  <span class="text-[10px] text-slate-400 uppercase tracking-wider block">Arti Dasar</span>
                  <span class="text-sm font-bold text-emerald-400" x-text="item.arti"></span>
                </div>
              </div>

              <!-- Card Body -->
              <div class="p-6 space-y-4 flex-1 flex flex-col justify-between">
                <div class="bg-slate-50 dark:bg-slate-800/60 p-3.5 rounded-2xl border border-slate-100 dark:border-slate-800 text-xs space-y-1">
                  <div class="text-slate-400 dark:text-slate-500 font-semibold uppercase tracking-wider text-[10px]">Cara Baca:</div>
                  <div class="text-slate-800 dark:text-slate-200 font-medium leading-relaxed" x-text="item.caraBaca"></div>
                </div>

                <div class="space-y-2">
                  <div class="text-xs font-semibold text-slate-400 dark:text-slate-500 border-b border-slate-100 dark:border-slate-800 pb-1.5 uppercase tracking-wider text-[10px]">Contoh Kata:</div>
                  <ul class="space-y-1.5 text-xs">
                    <template x-for="(ex, idx) in item.contoh" :key="idx">
                      <li class="flex items-center justify-between py-1 border-b border-slate-50 dark:border-slate-800/60 last:border-0">
                        <span class="font-serif text-sm font-bold text-slate-900 dark:text-white" x-text="ex.k"></span>
                        <span class="text-slate-500 italic font-mono" x-text="ex.b"></span>
                        <span class="font-medium text-slate-600 dark:text-slate-300" x-text="ex.a"></span>
                      </li>
                    </template>
                  </ul>
                </div>
              </div>

            </div>
          </template>
        </div>

      </main>
    </div>
  </div>

  <script>
    function kanjiApp() {
      return {
        sidebarOpen: false,
        materiAwalDropdown: true,
        kotobaDropdown: false,
        darkMode: false,

        async initApp() {
          this.initTheme();
          
          try {
            // Menggunakan Promise.allSettled agar pemuatan aman di iOS Safari
            const [sidebarRes, headerRes] = await Promise.allSettled([
              fetch('sidebar.html'),
              fetch('header.html')
            ]);

            // Inisialisasi Sidebar
            if (sidebarRes.status === 'fulfilled' && sidebarRes.value.ok) {
              const sidebarContainer = document.getElementById('sidebar-container');
              if (sidebarContainer) {
                sidebarContainer.innerHTML = await sidebarRes.value.text();
                this.renderDynamicKotobaSubmenus();
                
                // Re-initialize DOM Tree untuk Alpine di iOS WebKit
                if (window.Alpine) {
                  Alpine.initTree(sidebarContainer);
                }
              }
            }
            
            // Inisialisasi Header
            if (headerRes.status === 'fulfilled' && headerRes.value.ok) {
              const headerContainer = document.getElementById('header-container');
              if (headerContainer) {
                headerContainer.innerHTML = await headerRes.value.text();
                
                // Re-initialize DOM Tree untuk Alpine di iOS WebKit
                if (window.Alpine) {
                  Alpine.initTree(headerContainer);
                }
                this.bindHeaderThemeToggle();
              }
            }
          } catch (e) {
            console.error('Gagal memuat template modular:', e);
          }
        },

        renderDynamicKotobaSubmenus() {
          const container = document.getElementById('dynamic-kotoba-links');
          if (!container) return;

          let submenus = [];
          try {
            submenus = JSON.parse(localStorage.getItem('minna_submenus'));
          } catch(e) {
            submenus = null;
          }

          if (!submenus || !Array.isArray(submenus)) {
            submenus = [
              { id: 'ungkapan_waktu', title: 'Ungkapan Waktu' },
              { id: 'penanda_waktu', title: 'Penanda Waktu' },
              { id: 'kata_keterangan', title: 'Kata Keterangan' },
              { id: 'kata_benda', title: 'Kata Benda' },
              { id: 'kk_gol1', title: 'Kata Kerja Golongan I' },
              { id: 'kk_gol2', title: 'Kata Kerja Golongan II' },
              { id: 'kk_gol3', title: 'Kata Kerja Golongan III' },
              { id: 'salam', title: 'Salam (Aisatsu)' },
              { id: 'kazoku', title: 'Kazoku (Keluarga)' }
            ];
            localStorage.setItem('minna_submenus', JSON.stringify(submenus));
          }

          container.innerHTML = '';
          submenus.forEach(sub => {
            const link = document.createElement('a');
            link.href = `kotoba.html?cat=${sub.id}`;
            link.className = 'flex items-center gap-3 py-2.5 px-4 rounded-xl text-xs font-semibold text-slate-500 dark:text-slate-400 hover:text-blue-600 dark:hover:text-white hover:bg-slate-50 dark:hover:bg-slate-800/50 transition';
            link.innerHTML = `<i class="fa-solid fa-angle-right text-[10px]"></i> ${sub.title}`;
            container.appendChild(link);
          });
        },

        initTheme() {
          const savedTheme = localStorage.getItem('theme');
          if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            this.darkMode = true;
            document.documentElement.classList.add('dark');
          } else {
            this.darkMode = false;
            document.documentElement.classList.remove('dark');
            localStorage.setItem('theme', 'light');
          }
        },
        
        toggleDarkMode() {
          this.darkMode = !this.darkMode;
          if (this.darkMode) {
            document.documentElement.classList.add('dark');
            localStorage.setItem('theme', 'dark');
          } else {
            document.documentElement.classList.remove('dark');
            localStorage.setItem('theme', 'light');
          }
        },

        bindHeaderThemeToggle() {
          this.$nextTick(() => {
            const themeBtn = document.querySelector('#header-container [data-theme-toggle], #header-container button');
            if (themeBtn) {
              themeBtn.addEventListener('click', () => {
                this.toggleDarkMode();
              });
            }
          });
        },

        kanjiList: [
          { id: 1, kanji: "山", arti: "Gunung", caraBaca: "やま / サン", contoh: [{ k: "やま", b: "yama", a: "Gunung" }, { k: "ふじ山", b: "fujisan", a: "Gunung Fuji" }] },
          { id: 2, kanji: "川", arti: "Sungai", caraBaca: "かわ", contoh: [{ k: "川のなか", b: "kawa no naka", a: "di dalam Sungai" }, { k: "山川さん", b: "yamakawa-san", a: "Saudara Yamakawa" }] },
          { id: 3, kanji: "田", arti: "Sawah", caraBaca: "た / だ", contoh: [{ k: "田んぼ", b: "tanbo", a: "Sawah padi" }, { k: "山田さん", b: "yamada-san", a: "Saudara Yamada" }] },
          { id: 4, kanji: "日", arti: "Matahari", caraBaca: "ひ、び / ニチ、ニ", contoh: [{ k: "日よう日", b: "nichiyoubi", a: "Hari minggu" }, { k: "日本", b: "nihon", a: "Jepang" }] },
          { id: 5, kanji: "月", arti: "Bulan", caraBaca: "つき / ゲツ、ガツ", contoh: [{ k: "月よう日", b: "getsuyoubi", a: "Hari senin" }, { k: "一月", b: "ichigatsu", a: "Bulan Januari" }] }
        ]
      }
    }
  </script>
</body>
</html>
