<body class="antialiased bg-[#F4F7FE] dark:bg-slate-950 text-slate-700 dark:text-slate-100 transition-colors duration-300" x-data="katakanaApp()" x-init="initApp()">

  <div class="flex h-screen overflow-hidden">
    
    <!-- Mobile Sidebar Overlay -->
    <div x-show="sidebarOpen" @click="sidebarOpen = false" class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs z-40 md:hidden" x-transition.opacity></div>

    <!-- SIDEBAR CONTAINER (Dimuat otomatis dari sidebar.html) -->

    <!-- MAIN CONTENT AREA -->
    <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
      
      <!-- HEADER CONTAINER (Dimuat otomatis dari header.html) -->
      <div id="header-container" class="contents"></div>

      <!-- MAIN BODY CONTENT (Isi Halaman Katakana) -->

        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-white dark:bg-slate-900 p-6 rounded-3xl border border-slate-100 dark:border-slate-800 shadow-2xs">
          <div>
            <h3 class="text-base font-bold text-slate-900 dark:text-white mb-1">Tabel Lengkap Katakana (カタカナ)</h3>
            <p class="text-xs text-slate-500 dark:text-slate-400">Digunakan untuk menuliskan kata serapan bahasa asing, nama negara, atau kata penegas.</p>
          </div>
          <span class="text-xs bg-blue-50 dark:bg-blue-950/50 text-blue-600 dark:text-blue-400 font-bold px-4 py-2 rounded-xl border border-blue-100 dark:border-blue-900/50" x-text="katakanaList.length + ' Karakter'"></span>
        </div>

        <!-- TABEL KATAKANA -->
        <div class="bg-white dark:bg-slate-900 rounded-3xl border border-slate-100 dark:border-slate-800 shadow-sm overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse min-w-[400px]">
              <thead>
                <tr class="bg-slate-50 dark:bg-slate-800/60 border-b border-slate-100 dark:border-slate-800 text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">
                  <th class="py-4 px-6">Kategori Bunyi</th>
                  <th class="py-4 px-6">Romaji</th>
                  <th class="py-4 px-6 text-center">Huruf Katakana</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-100 dark:divide-slate-800/60 text-sm">
                <template x-for="(item, index) in katakanaList" :key="index">
                  <tr class="hover:bg-slate-50/80 dark:hover:bg-slate-800/40 transition" :class="item.kategori.includes('Khusus') ? 'bg-amber-50/30 dark:bg-amber-950/10' : ''">
                    <td class="py-4 px-6 font-medium text-slate-800 dark:text-slate-200" x-text="item.kategori"></td>
                    <td class="py-4 px-6 italic font-mono text-slate-500 dark:text-slate-400" x-text="item.romaji"></td>
                    <td class="py-4 px-6 font-bold text-blue-600 dark:text-blue-400 text-3xl text-center font-serif" x-text="item.katakana"></td>

                </template>
              </tbody>
            </table>
          </div>

        darkMode: false,

        async initApp() {
          this.initTheme();
          try {
            const sidebarRes = await fetch('./sidebar.html');
            if (sidebarRes.ok) {
              document.getElementById('sidebar-container').innerHTML = await sidebarRes.text();
              this.renderDynamicKotobaSubmenus();
            }
            const headerRes = await fetch('./header.html');
            if (headerRes.ok) {
              document.getElementById('header-container').innerHTML = await headerRes.text();
            }
          } catch (e) {
            console.error('Gagal memuat template modular:', e);
          }
        },

        renderDynamicKotobaSubmenus() {
          const container = document.getElementById('dynamic-kotoba-links');
          if (!container) return;

          let submenus = JSON.parse(localStorage.getItem('minna_submenus'));
          if (!submenus) {
            submenus = [
              { id: 'ungkapan_waktu', title: 'Ungkapan Waktu' },
              { id: 'penanda_waktu', title: 'Penanda Waktu' },
              { id: 'kata_keterangan', title: 'Kata Keterangan' },
              { id: 'kata_benda', title: 'Kata Benda' },
              { id: 'kk_gol1', title: 'Kata Kerja Golongan I' },
              { id: 'kk_gol2', title: 'Kata Kerja Golongan II' },
              { id: 'kk_gol3', title: 'Kata Kerja Golongan III' },
              { id: 'salam', title: 'Salam (Aisatsu)' },
              { id: 'kazoku', title: 'Kazoku (Keluarga)' }
            ];
            localStorage.setItem('minna_submenus', JSON.stringify(submenus));
          }

          submenus.forEach(sub => {
            const link = document.createElement('a');
            link.href = `kotoba.html?cat=${sub.id}`;
            link.className = 'flex items-center gap-3 py-2.5 px-4 rounded-xl text-xs font-semibold text-slate-500 dark:text-slate-400 hover:text-blue-600 dark:hover:text-white hover:bg-slate-50 dark:hover:bg-slate-800/50 transition';
            link.innerHTML = `<i class="fa-solid fa-angle-right text-[10px]"></i> ${sub.title}`;
            container.appendChild(link);
          });
        },

        initTheme() {
          const savedTheme = localStorage.getItem('theme');
          if (savedTheme === 'dark') {
            this.darkMode = true;
            document.documentElement.classList.add('dark');
          } else {
            this.darkMode = false;
            document.documentElement.classList.remove('dark');
          }
        },
        
        toggleDarkMode() {
          this.darkMode = !this.darkMode;
          if (this.darkMode) {
            document.documentElement.classList.add('dark');
            localStorage.setItem('theme', 'dark');
          } else {
            document.documentElement.classList.remove('dark');
            localStorage.setItem('theme', 'light');
          }
        },
