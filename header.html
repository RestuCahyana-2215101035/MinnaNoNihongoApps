<!-- TOP NAVIGATION BAR -->
<header class="bg-white/80 dark:bg-slate-900/80 backdrop-blur-md -webkit-backdrop-blur-md transform-gpu sticky top-0 z-30 px-6 sm:px-8 py-4 sm:py-5 flex items-center justify-between border-b border-slate-100 dark:border-slate-800 shadow-2xs">
  <div class="flex items-center gap-4">
    <!-- Tombol Buka Sidebar Mobile (iOS Safari Touch Fix) -->
    <button type="button" 
            role="button"
            aria-label="Buka Menu"
            @click="sidebarOpen = true" 
            onclick=""
            style="cursor: pointer;"
            class="md:hidden text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white focus:outline-none cursor-pointer p-2 rounded-xl active:opacity-70 touch-manipulation">
      <i class="fa-solid fa-bars text-xl pointer-events-none"></i>
    </button>
  </div>

  <!-- Tombol Toggle Dark / Light Mode -->
  <div class="flex items-center">
    <button type="button" 
            role="button"
            aria-label="Ubah Tema"
            @click="toggleDarkMode()" 
            onclick=""
            style="cursor: pointer;"
            class="w-11 h-11 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 rounded-full flex items-center justify-center transition shadow-2xs cursor-pointer relative overflow-hidden group active:scale-95 touch-manipulation" 
            title="Ubah Tema">
      <i class="fa-solid fa-sun text-amber-500 text-base absolute transition-transform duration-500 pointer-events-none" :class="darkMode ? 'rotate-90 scale-0 opacity-0' : 'rotate-0 scale-100 opacity-100'"></i>
      <i class="fa-solid fa-moon text-blue-400 text-base absolute transition-transform duration-500 pointer-events-none" :class="darkMode ? 'rotate-0 scale-100 opacity-100' : '-rotate-90 scale-0 opacity-0'"></i>
    </button>
  </div>
</header>
