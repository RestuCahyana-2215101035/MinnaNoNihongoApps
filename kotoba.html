<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minna no Nihongo - Kosakata (Kotoba)</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class', }
  </script>
  <!-- Google Fonts: DM Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
  
  <!-- Alpine.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- DataTables CSS & jQuery -->
  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

  <style>
    body { font-family: 'DM Sans', sans-serif; }
    #kotobaTable { width: 100% !important; }
    /* Custom styling agar DataTables menyatu dengan Tailwind & Dark Mode */
    .dataTables_wrapper .dataTables_length select,
    .dataTables_wrapper .dataTables_filter input {
      border: 1px solid #cbd5e1;
      border-radius: 0.75rem;
      padding: 0.35rem 0.75rem;
      font-size: 0.75rem;
      outline: none;
      background-color: transparent;
    }
    .dark .dataTables_wrapper .dataTables_length select,
    .dark .dataTables_wrapper .dataTables_filter input {
      border-color: #334155;
      color: #f1f5f9;
      background-color: #020617;
    }
    .dataTables_wrapper .dataTables_info, 
    .dataTables_wrapper .dataTables_paginate {
      font-size: 0.75rem;
      margin-top: 1rem;
    }
    .dataTables_wrapper .dataTables_paginate .paginate_button {
      border-radius: 0.5rem !important;
      border: 1px solid transparent !important;
      background: transparent !important;
      color: inherit !important;
    }
    .dataTables_wrapper .dataTables_paginate .paginate_button.current {
      background: #2563eb !important;
      color: white !important;
      border-color: #2563eb !important;
    }
  </style>
</head>
<body class="antialiased bg-[#F4F7FE] dark:bg-slate-950 text-slate-700 dark:text-slate-100 transition-colors duration-300" x-data="kotobaPageApp()" x-init="initApp()">

  <div class="flex h-screen overflow-hidden">
    
    <!-- Mobile Sidebar Overlay -->
    <div x-show="sidebarOpen" @click="sidebarOpen = false" class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs z-40 md:hidden" x-transition.opacity></div>

    <!-- SIDEBAR CONTAINER -->
    <div id="sidebar-container" class="contents"></div>

    <!-- MAIN CONTENT AREA -->
    <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
      
      <!-- HEADER CONTAINER -->
      <div id="header-container" class="contents"></div>

      <!-- MAIN BODY CONTENT -->
      <main class="flex-1 overflow-y-auto p-8 space-y-8">
        
        <!-- Header Halaman -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-white dark:bg-slate-900 p-6 rounded-3xl border border-slate-100 dark:border-slate-800 shadow-2xs">
          <div>
            <h3 class="text-base font-bold text-slate-900 dark:text-white mb-1" x-text="categoryTitle"></h3>
            <p class="text-xs text-slate-500 dark:text-slate-400">Daftar kosakata bahasa Jepang lengkap dengan terjemahan dan pelafalan.</p>
          </div>
          <span class="text-xs bg-blue-50 dark:bg-blue-950/50 text-blue-600 dark:text-blue-400 font-bold px-4 py-2 rounded-xl border border-blue-100 dark:border-blue-900/50" x-text="itemList.length + ' Kosakata'"></span>
        </div>

        <!-- TABEL KOSAKATA / KONDISI KOSONG -->
        <div class="bg-white dark:bg-slate-900 rounded-3xl border border-slate-100 dark:border-slate-800 shadow-sm overflow-hidden p-6">
          
          <!-- Jika Data Kosakata Ada -->
          <div class="overflow-x-auto w-full" x-show="itemList.length > 0">
            <table id="kotobaTable" class="w-full text-left border-collapse min-w-[500px]">
              <thead>
                <tr class="bg-slate-50 dark:bg-slate-800/60 border-b border-slate-100 dark:border-slate-800 text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">
                  <th class="py-3.5 px-6">Bahasa Indonesia</th>
                  <th class="py-3.5 px-6">Romaji</th>
                  <th class="py-3.5 px-6">Hiragana</th>
                  <th class="py-3.5 px-6">Katakana</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-100 dark:divide-slate-800/60 text-sm">
                <!-- Data dirender melalui DataTables secara dinamis -->
              </tbody>
            </table>
          </div>

          <!-- Jika Kosakata Kosong / Belum Diisi -->
          <div x-show="itemList.length === 0" class="p-12 text-center space-y-3">
            <div class="w-12 h-12 bg-slate-100 dark:bg-slate-800 text-slate-400 rounded-2xl flex items-center justify-center mx-auto text-lg">
              <i class="fa-solid fa-folder-open"></i>
            </div>
            <h4 class="text-sm font-bold text-slate-800 dark:text-slate-200">Belum Ada Kosakata</h4>
            <p class="text-xs text-slate-400 max-w-sm mx-auto">Kategori ini belum memiliki daftar kosakata. Silakan tambahkan kosakata melalui Panel Admin.</p>
          </div>

        </div>

      </main>
    </div>
  </div>

  <!-- SCRIPT KOTOBA PAGE -->
  <script>
    function kotobaPageApp() {
      return {
        sidebarOpen: false,
        materiAwalDropdown: false,
        kotobaDropdown: true,
        darkMode: false,

        categoryTitle: 'Daftar Kosakata',
        itemList: [],
        dataTableInstance: null,

        async initApp() {
          this.initTheme();
          try {
            const sidebarRes = await fetch('./sidebar.html');
            if (sidebarRes.ok) {
              document.getElementById('sidebar-container').innerHTML = await sidebarRes.text();
              this.renderDynamicKotobaSubmenus();
            }
            const headerRes = await fetch('./header.html');
            if (headerRes.ok) {
              document.getElementById('header-container').innerHTML = await headerRes.text();
            }
          } catch (e) {
            console.error('Gagal memuat template modular:', e);
          }

          this.loadCategoryData();
          
          this.$nextTick(() => {
            this.initOrUpdateDataTable();
          });
        },

        loadCategoryData() {
          const urlParams = new URLSearchParams(window.location.search);
          const catId = (urlParams.get('cat') || '').toLowerCase();

          let submenus = JSON.parse(localStorage.getItem('minna_submenus')) || [];
          let currentSub = submenus.find(s => s.id.toLowerCase() === catId);
          
          if (currentSub) {
            this.categoryTitle = currentSub.title;
          } else if (submenus.length > 0) {
            this.categoryTitle = submenus[0].title;
          }

          let vocabData = JSON.parse(localStorage.getItem('minna_vocab_data')) || {};
          
          let targetKey = catId;
          if (!targetKey && submenus.length > 0) {
            targetKey = submenus[0].id.toLowerCase();
          }

          let matchedKey = Object.keys(vocabData).find(k => k.toLowerCase() === targetKey);
          let rawItems = matchedKey ? vocabData[matchedKey] : [];
          
          this.itemList = Array.isArray(rawItems) ? rawItems : [];
        },

        initOrUpdateDataTable() {
          if (this.itemList.length === 0) return;

          let tableData = this.itemList.map(item => {
            return [
              `<span class="font-medium text-slate-800 dark:text-slate-200">${item.indonesia}</span>`,
              `<span class="italic font-mono text-slate-500 dark:text-slate-400">${item.romaji}</span>`,
              `<span class="font-bold text-slate-900 dark:text-white">${item.hiragana}</span>`,
              `<span class="text-blue-600 dark:text-blue-400 font-medium">${item.katakana}</span>`
            ];
          });

          if ($.fn.DataTable.isDataTable('#kotobaTable')) {
            this.dataTableInstance.clear();
            this.dataTableInstance.rows.add(tableData);
            this.dataTableInstance.draw();
          } else {
            this.dataTableInstance = $('#kotobaTable').DataTable({
              data: tableData,
              pageLength: 10,
              lengthMenu: [5, 10, 25, 50],
              language: {
                search: "Cari:",
                lengthMenu: "Tampilkan _MENU_ data",
                info: "Menampilkan _START_ sampai _END_ dari _TOTAL_ data",
                paginate: {
                  first: "Pertama",
                  last: "Terakhir",
                  next: "Selanjutnya",
                  previous: "Sebelumnya"
                },
                zeroRecords: "Tidak ada data ditemukan",
                infoEmpty: "Menampilkan 0 sampai 0 dari 0 data",
                infoFiltered: "(disaring dari _MAX_ total data)"
              }
            });
          }
        },

        renderDynamicKotobaSubmenus() {
          const container = document.getElementById('dynamic-kotoba-links');
          if (!container) return;
          let submenus = JSON.parse(localStorage.getItem('minna_submenus')) || [];
          container.innerHTML = ''; 
          submenus.forEach(sub => {
            const link = document.createElement('a');
            link.href = `kotoba.html?cat=${sub.id}`;
            link.className = 'flex items-center gap-3 py-2.5 px-4 rounded-xl text-xs font-semibold text-slate-500 dark:text-slate-400 hover:text-blue-600 dark:hover:text-white hover:bg-slate-50 dark:hover:bg-slate-800/50 transition';
            link.innerHTML = `<i class="fa-solid fa-angle-right text-[10px]"></i> ${sub.title}`;
            container.appendChild(link);
          });
        },

        initTheme() {
          const savedTheme = localStorage.getItem('theme');
          if (savedTheme === 'dark') {
            this.darkMode = true;
            document.documentElement.classList.add('dark');
          } else {
            this.darkMode = false;
            document.documentElement.classList.remove('dark');
          }
        },
        
        toggleDarkMode() {
          this.darkMode = !this.darkMode;
          if (this.darkMode) {
            document.documentElement.classList.add('dark');
            localStorage.setItem('theme', 'dark');
          } else {
            document.documentElement.classList.remove('dark');
            localStorage.setItem('theme', 'light');
          }
        }
      }
    }
  </script>
</body>
</html>
