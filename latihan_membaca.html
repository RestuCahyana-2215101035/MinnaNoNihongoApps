<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minna no Nihongo - Latihan Membaca</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">

  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body { font-family: 'DM Sans', sans-serif; }
  </style>
</head>

<body
  class="antialiased bg-[#F4F7FE] dark:bg-slate-950 text-slate-700 dark:text-slate-100 transition-colors duration-300"
  x-data="latihanMembacaApp()"
  x-init="initApp()"
>

  <div class="flex h-screen overflow-hidden">

    <!-- Mobile Sidebar Overlay -->
    <div
      x-show="sidebarOpen"
      @click="sidebarOpen = false"
      class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs z-40 md:hidden"
      x-transition.opacity
    ></div>

    <!-- SIDEBAR CONTAINER -->
    <div id="sidebar-container" class="contents"></div>

    <!-- MAIN CONTENT AREA -->
    <div class="flex-1 flex flex-col min-w-0 overflow-hidden">

      <!-- HEADER CONTAINER -->
      <div id="header-container" class="contents"></div>

      <!-- MAIN BODY CONTENT -->
      <main class="flex-1 overflow-y-auto p-8 space-y-8">

        <!-- Header Halaman -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-white dark:bg-slate-900 p-6 rounded-3xl border border-slate-100 dark:border-slate-800 shadow-2xs">
          <div>
            <h3 class="text-base font-bold text-slate-900 dark:text-white mb-1">
              Latihan Membaca Bahasa Jepang
            </h3>

            <p class="text-xs text-slate-500 dark:text-slate-400">
              Pilih tingkat kesukaran dan variasi cerita (100% murni Hiragana & Katakana, tanpa Kanji).
            </p>
          </div>

          <span
            class="text-xs bg-blue-50 dark:bg-blue-950/50 text-blue-600 dark:text-blue-400 font-bold px-4 py-2 rounded-xl border border-blue-100 dark:border-blue-900/50"
            x-text="currentLevelTitle"
          ></span>
        </div>

        <!-- PILIHAN TINGKAT KESUKARAN -->
        <div class="bg-white dark:bg-slate-900 p-6 rounded-3xl border border-slate-100 dark:border-slate-800 shadow-sm space-y-4">
          <label class="block text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider">
            Pilih Panjang Bacaan:
          </label>

          <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
            <template x-for="lvl in tingkatList" :key="lvl.key">
              <button
                @click="currentTingkat = lvl.key"
                :class="currentTingkat === lvl.key
                  ? 'bg-blue-600 text-white font-bold shadow-lg shadow-blue-500/20 border-blue-600'
                  : 'bg-slate-50 hover:bg-slate-100 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 border-slate-100 dark:border-slate-800'"
                class="py-3.5 px-4 rounded-2xl text-xs font-bold transition flex items-center justify-center gap-2 border"
              >
                <i :class="lvl.icon"></i>
                <span x-text="lvl.label"></span>
              </button>
            </template>
          </div>
        </div>

        <!-- KONTEN BACAAN SESUAI TINGKAT -->
        <div class="space-y-6">

          <template x-for="cerita in getCeritaByTingkat()" :key="cerita.id">

            <div class="bg-white dark:bg-slate-900 rounded-3xl p-6 md:p-8 border border-slate-100 dark:border-slate-800 shadow-sm space-y-6">

              <!-- Judul Cerita -->
              <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 border-b border-slate-100 dark:border-slate-800 pb-4">

                <h3 class="font-bold text-slate-900 dark:text-white text-base flex items-center gap-3">

                  <span
                    class="w-8 h-8 rounded-xl bg-blue-50 dark:bg-blue-950/50 text-blue-600 dark:text-blue-400 flex items-center justify-center text-xs font-mono font-bold"
                    x-text="cerita.id"
                  ></span>

                  <span x-text="cerita.judul"></span>

                </h3>

                <span
                  class="text-xs bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 font-semibold px-3 py-1.5 rounded-xl"
                  x-text="cerita.badge"
                ></span>

              </div>

              <!-- Teks Utama Jepang -->
              <div class="bg-slate-50 dark:bg-slate-800/50 p-6 rounded-2xl border border-slate-100 dark:border-slate-800 font-serif text-base md:text-lg leading-loose tracking-wide text-slate-800 dark:text-slate-200">
                <p x-text="cerita.paragraf"></p>
              </div>

              <!-- Terjemahan Indonesia -->
              <div class="space-y-2 pt-2 border-t border-slate-100 dark:border-slate-800 text-sm">

                <span class="font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider text-[10px] block">
                  Terjemahan Indonesia:
                </span>

                <p
                  class="text-slate-600 dark:text-slate-300 italic leading-relaxed"
                  x-text="cerita.terjemahan"
                ></p>

              </div>

            </div>

          </template>

        </div>

      </main>
    </div>
  </div>

  <script>
    function latihanMembacaApp() {
      return {
        sidebarOpen: false,
        materiAwalDropdown: true,
        kotobaDropdown: false,
        darkMode: false,
        currentTingkat: 'mudah',

        get currentLevelTitle() {
          if (this.currentTingkat === 'mudah') {
            return 'Tingkat: Pendek (Hingga 10 Kalimat)';
          }

          if (this.currentTingkat === 'menengah') {
            return 'Tingkat: Sedang (Hingga 20 Kalimat)';
          }

          return 'Tingkat: Panjang (Hingga 30 Kalimat)';
        },

        async initApp() {
          this.initTheme();

          try {
            const sidebarRes = await fetch('./sidebar.html');

            if (sidebarRes.ok) {
              document.getElementById('sidebar-container').innerHTML =
                await sidebarRes.text();

              this.renderDynamicKotobaSubmenus();
            }

            const headerRes = await fetch('./header.html');

            if (headerRes.ok) {
              document.getElementById('header-container').innerHTML =
                await headerRes.text();
            }

          } catch (e) {
            console.error('Gagal memuat template modular:', e);
          }
        },

        renderDynamicKotobaSubmenus() {
          const container = document.getElementById('dynamic-kotoba-links');

          if (!container) return;

          let submenus = JSON.parse(
            localStorage.getItem('minna_submenus')
          );

          if (!submenus) {
            submenus = [
              { id: 'ungkapan_waktu', title: 'Ungkapan Waktu' },
              { id: 'penanda_waktu', title: 'Penanda Waktu' },
              { id: 'kata_keterangan', title: 'Kata Keterangan' },
              { id: 'kata_benda', title: 'Kata Benda' },
              { id: 'kk_gol1', title: 'Kata Kerja Golongan I' },
              { id: 'kk_gol2', title: 'Kata Kerja Golongan II' },
              { id: 'kk_gol3', title: 'Kata Kerja Golongan III' },
              { id: 'salam', title: 'Salam (Aisatsu)' },
              { id: 'kazoku', title: 'Kazoku (Keluarga)' }
            ];

            localStorage.setItem(
              'minna_submenus',
              JSON.stringify(submenus)
            );
          }

          submenus.forEach(sub => {
            const link = document.createElement('a');

            link.href = `kotoba.html?cat=${sub.id}`;

            link.className =
              'flex items-center gap-3 py-2.5 px-4 rounded-xl text-xs font-semibold text-slate-500 dark:text-slate-400 hover:text-blue-600 dark:hover:text-white hover:bg-slate-50 dark:hover:bg-slate-800/50 transition';

            link.innerHTML =
              `<i class="fa-solid fa-angle-right text-[10px]"></i> ${sub.title}`;

            container.appendChild(link);
          });
        },

        initTheme() {
          const savedTheme = localStorage.getItem('theme');

          if (savedTheme === 'dark') {
            this.darkMode = true;
            document.documentElement.classList.add('dark');
          } else {
            this.darkMode = false;
            document.documentElement.classList.remove('dark');
          }
        },

        toggleDarkMode() {
          this.darkMode = !this.darkMode;

          if (this.darkMode) {
            document.documentElement.classList.add('dark');
            localStorage.setItem('theme', 'dark');
          } else {
            document.documentElement.classList.remove('dark');
            localStorage.setItem('theme', 'light');
          }
        },

        tingkatList: [
          {
            key: 'mudah',
            label: 'Pendek (10 Kalimat)',
            icon: 'fa-regular fa-face-smile text-emerald-500'
          },
          {
            key: 'menengah',
            label: 'Sedang (20 Kalimat)',
            icon: 'fa-solid fa-face-meh text-amber-500'
          },
          {
            key: 'banyak',
            label: 'Panjang (30 Kalimat)',
            icon: 'fa-solid fa-face-grin-stars text-rose-500'
          }
        ],

        getCeritaByTingkat() {
          return this.databaseCerita.filter(
            c => c.tingkat === this.currentTingkat
          );
        },
